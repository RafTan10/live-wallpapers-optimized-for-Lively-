<!DOCTYPE html>

<title>Neural Network · Live Training</title>

-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>

<body>
<canvas id="base"></canvas>
<canvas id="over"></canvas>
<script>
// ===================== SETTINGS =====================
const SETTINGS = {
  theme: 'grey',    // 'grey' | 'warm' | 'green' | 'ice' | 'amber'
  math: true,       // equations, labels and readouts (false = clean version)
  parallax: true,   // gentle shift with the mouse
  fps: 30,          // frame cap; 30 keeps the GPU/CPU load low
  retrainEvery: 75, // seconds before the network starts learning again
};
// ====================================================

// Computer science — a small neural network (2-8-8-1, tanh) actually training by gradient descent
// to separate two rings of points. Its decision boundary, weights, activations and loss are live.
const SCENE = {
  focus: [0.62, 0.48],
  anchors: [[0.30, 0.08], [0.52, 0.05], [0.42, 0.92], [0.62, 0.95], [0.40, 0.84], [0.22, 0.86]],
  title: 'NEURAL NETWORK · 2-8-8-1 · tanh',
  sub: 'stochastic gradient descent · binary cross-entropy',
  eqs: [
    { e: 'a⁽ˡ⁾ = tanh(W⁽ˡ⁾ a⁽ˡ⁻¹⁾ + b⁽ˡ⁾)', n: 'forward pass through one layer' },
    { e: 'σ(z) = 1 / (1 + e⁻ᶻ)', n: 'sigmoid output — a probability' },
    { e: 'L = −[y log ŷ + (1 − y) log(1 − ŷ)]', n: 'binary cross-entropy loss' },
    { e: 'δ⁽ˡ⁾ = (W⁽ˡ⁺¹⁾ᵀ δ⁽ˡ⁺¹⁾) ⊙ (1 − a⁽ˡ⁾²)', n: 'backpropagation' },
    { e: 'W ← W − η ∂L/∂W', n: 'gradient descent update' },
    { e: '∂L/∂z = ŷ − y', n: 'why sigmoid + cross-entropy pair so neatly' }
  ],
  init() {
    this.sizes = [2, 8, 8, 1];
    this.reset();
    this.data = [];
    for (let i = 0; i < 220; i++) {
      const y = i % 2, r = y ? rand(0.55, 0.9) : rand(0, 0.35), a = rand(0, TAU);
      this.data.push([r * Math.cos(a), r * Math.sin(a), y]);
    }
    this.grid = 34; this.heat = new Float32Array(this.grid * this.grid);
    this.cv = document.createElement('canvas'); this.cv.width = this.cv.height = this.grid;
    this.cx2 = this.cv.getContext('2d'); this.img = this.cx2.createImageData(this.grid, this.grid);
    this.frame = 0;
  },
  reset() {
    const s = this.sizes;
    this.Wt = []; this.B = [];
    for (let l = 1; l < s.length; l++) {
      const m = []; for (let i = 0; i < s[l]; i++) { const row = []; for (let j = 0; j < s[l - 1]; j++) row.push(rand(-1, 1) * Math.sqrt(1.5 / s[l - 1])); m.push(row); }
      this.Wt.push(m); this.B.push(new Array(s[l]).fill(0));
    }
    this.loss = []; this.steps = 0; this.epochT = 0;
  },
  forward(x) {
    const A = [x];
    for (let l = 0; l < this.Wt.length; l++) {
      const prev = A[l], out = [];
      for (let i = 0; i < this.Wt[l].length; i++) {
        let z = this.B[l][i]; const w = this.Wt[l][i];
        for (let j = 0; j < prev.length; j++) z += w[j] * prev[j];
        out.push(l === this.Wt.length - 1 ? 1 / (1 + Math.exp(-z)) : Math.tanh(z));
      }
      A.push(out);
    }
    return A;
  },
  train(batch, lr) {
    const gW = this.Wt.map(m => m.map(r => r.map(() => 0))), gB = this.B.map(b => b.map(() => 0));
    let Ls = 0;
    for (let n = 0; n < batch; n++) {
      const d = this.data[(Math.random() * this.data.length) | 0];
      const A = this.forward([d[0], d[1]]), yh = A[A.length - 1][0];
      Ls += -(d[2] * Math.log(yh + 1e-9) + (1 - d[2]) * Math.log(1 - yh + 1e-9));
      let delta = [yh - d[2]];
      for (let l = this.Wt.length - 1; l >= 0; l--) {
        const prev = A[l];
        for (let i = 0; i < delta.length; i++) { gB[l][i] += delta[i]; for (let j = 0; j < prev.length; j++) gW[l][i][j] += delta[i] * prev[j]; }
        if (l > 0) {
          const nd = [];
          for (let j = 0; j < prev.length; j++) { let s = 0; for (let i = 0; i < delta.length; i++) s += this.Wt[l][i][j] * delta[i]; nd.push(s * (1 - prev[j] * prev[j])); }
          delta = nd;
        }
      }
    }
    for (let l = 0; l < this.Wt.length; l++) for (let i = 0; i < this.Wt[l].length; i++) {
      this.B[l][i] -= lr * gB[l][i] / batch;
      for (let j = 0; j < this.Wt[l][i].length; j++) this.Wt[l][i][j] -= lr * gW[l][i][j] / batch;
    }
    return Ls / batch;
  },
  update(dt, t) {
    this.epochT += dt;
    if (this.epochT > SETTINGS.retrainEvery) this.reset();
    let L = 0;
    for (let k = 0; k < 6; k++) { L += this.train(16, 0.25); this.steps++; }
    this.loss.push(L / 6); if (this.loss.length > 600) this.loss.shift();
    this.frame++;
    if (this.frame % 6 === 0) {
      const g = this.grid, d = this.img.data;
      for (let j = 0; j < g; j++) for (let i = 0; i < g; i++) {
        const p = this.forward([(i + 0.5) / g * 2 - 1, (j + 0.5) / g * 2 - 1]);
        const v = p[p.length - 1][0], c = RGB[Math.round(4 + v * 12)], k = (j * g + i) * 4;
        d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 25 + Math.abs(v - 0.5) * 110;
      }
      this.cx2.putImageData(this.img, 0, 0);
    }
    const a = t * 0.35;
    this.probe = [0.75 * Math.cos(a) * (0.5 + 0.5 * Math.sin(t * 0.21)), 0.75 * Math.sin(a) * (0.5 + 0.5 * Math.sin(t * 0.21))];
    this.act = this.forward(this.probe);
  },
  layout() {
    const x0 = W * 0.44, x1 = W * 0.9, yc = H * 0.46, span = H * 0.62;
    return this.sizes.map((n, l) => {
      const x = lerp(x0, x1, l / (this.sizes.length - 1));
      return Array.from({ length: n }, (_, i) => [x, yc + (n === 1 ? 0 : (i / (n - 1) - 0.5) * span * (0.35 + 0.65 * n / 8))]);
    });
  },
  draw(t, ox, oy) {
    const Lp = this.layout().map(layer => layer.map(([x, y]) => [x + ox, y + oy]));
    ctx.globalCompositeOperation = 'lighter';
    // edges: brightness ∝ |weight|, dashed when negative; pulses travel forward
    for (let l = 0; l < this.Wt.length; l++) for (let i = 0; i < this.Wt[l].length; i++) for (let j = 0; j < this.Wt[l][i].length; j++) {
      const w = this.Wt[l][i][j], a = Lp[l][j], b = Lp[l + 1][i];
      ctx.globalAlpha = clamp(0.04 + Math.abs(w) * 0.22, 0, 0.6); ctx.strokeStyle = PAL[w > 0 ? 19 : 13];
      ctx.lineWidth = (0.5 + Math.min(2, Math.abs(w)) * 0.7) * scale;
      if (w < 0) ctx.setLineDash([3 * scale, 4 * scale]);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      ctx.setLineDash([]);
      const ph = ((t * 0.6 - l * 0.33) % 1 + 1) % 1;
      const act = Math.abs(this.act[l][j]);
      if (act > 0.25 && Math.abs(w) > 0.4) {
        ctx.globalAlpha = 0.7 * act; ctx.fillStyle = PAL[22];
        ctx.fillRect(lerp(a[0], b[0], ph) - 1.2 * scale, lerp(a[1], b[1], ph) - 1.2 * scale, 2.4 * scale, 2.4 * scale);
      }
    }
    // nodes: brightness = activation for the moving probe input
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    Lp.forEach((layer, l) => layer.forEach(([x, y], i) => {
      const a = this.act[l][i], v = l === Lp.length - 1 ? a : (a + 1) / 2;
      const r = (l === 0 || l === Lp.length - 1 ? 13 : 10) * scale;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1; ctx.fillStyle = `hsl(${theme.hue},${Math.min(theme.sat, 10)}%,${(4 + v * 14).toFixed(1)}%)`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.5 + 0.4 * v; ctx.strokeStyle = PAL[Math.round(14 + 9 * v)]; ctx.lineWidth = 1.1 * scale;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 0.85; ctx.fillStyle = PAL[22]; ctx.font = MONO(8.5);
      ctx.fillText(a.toFixed(2).replace('0.', '.'), x, y);
    }));
    // decision-boundary inset with the data points
    const bx = W * 0.2, by = H * 0.24, bs = H * 0.34;
    ctx.globalCompositeOperation = 'source-over';
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 1; ctx.drawImage(this.cv, bx, by, bs, bs);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.35; ctx.strokeStyle = PAL[15]; ctx.lineWidth = 0.8 * scale; ctx.strokeRect(bx, by, bs, bs);
    for (const d of this.data) {
      const x = bx + (d[0] + 1) / 2 * bs, y = by + (d[1] + 1) / 2 * bs;
      ctx.globalAlpha = 0.85; ctx.strokeStyle = ctx.fillStyle = PAL[d[2] ? 23 : 16];
      if (d[2]) ctx.fillRect(x - 1.4 * scale, y - 1.4 * scale, 2.8 * scale, 2.8 * scale);
      else { ctx.beginPath(); ctx.arc(x, y, 1.8 * scale, 0, TAU); ctx.stroke(); }
    }
    const px = bx + (this.probe[0] + 1) / 2 * bs, py = by + (this.probe[1] + 1) / 2 * bs;
    ctx.globalAlpha = 0.9; ctx.strokeStyle = PAL[23]; ctx.lineWidth = 1 * scale;
    ctx.beginPath(); ctx.arc(px, py, 6 * scale, 0, TAU); ctx.moveTo(px - 10 * scale, py); ctx.lineTo(px + 10 * scale, py); ctx.moveTo(px, py - 10 * scale); ctx.lineTo(px, py + 10 * scale); ctx.stroke();
    // loss curve
    const lx = bx, ly = by + bs + 60 * scale, lw = bs, lh = H * 0.12;
    ctx.globalAlpha = 0.3; ctx.strokeStyle = PAL[14];
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + lh); ctx.lineTo(lx + lw, ly + lh); ctx.stroke();
    ctx.beginPath();
    this.loss.forEach((v, i) => { const x = lx + i / 600 * lw, y = ly + lh - clamp(v / 0.8, 0, 1) * lh; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.globalAlpha = 0.8; ctx.strokeStyle = PAL[20]; ctx.lineWidth = 1 * scale; ctx.stroke();
    this.ins = [bx, by, bs, lx, ly, lw, lh, Lp];
  },
  drawOver() {
    if (!SETTINGS.math || !this.ins) return;
    const o = octx, [bx, by, bs, lx, ly, lw, lh, Lp] = this.ins;
    o.font = MONO(10.5); o.textBaseline = 'middle'; o.textAlign = 'left'; o.fillStyle = PAL[17];
    o.globalAlpha = 0.65; o.fillText('DECISION BOUNDARY   ŷ(x₁, x₂)', bx, by - 14 * scale);
    const last = this.loss[this.loss.length - 1] || 0;
    o.fillText(`LOSS   L = ${last.toFixed(3)}   step ${this.steps}`, lx, ly - 14 * scale);
    let acc = 0; for (const d of this.data) { const p = this.forward([d[0], d[1]]); if ((p[3][0] > 0.5) === (d[2] === 1)) acc++; }
    o.globalAlpha = 0.5; o.fillText(`accuracy ${(acc / this.data.length * 100).toFixed(1)}%   η = 0.25   batch 16`, lx, ly + lh + 16 * scale);
    o.textAlign = 'center';
    ['input x', 'hidden 1', 'hidden 2', 'output ŷ'].forEach((s, l) => { o.globalAlpha = 0.5; o.fillText(s, Lp[l][0][0], H * 0.08 + Lp[l][0][1] * 0 + H * 0.06); });
    o.globalAlpha = 0.75; o.textAlign = 'left';
    const out = Lp[3][0];
    o.fillText(`P(outer ring) = ${this.act[3][0].toFixed(3)}`, out[0] + 20 * scale, out[1]);
  },
  hud() { return [`re-initialised every ${SETTINGS.retrainEvery} s`]; }
};


// ===================== ENGINE (shared) =====================
const THEMES = {
  grey:  { hue: 220, sat: 7 },
  warm:  { hue: 30, sat: 45 },
  green: { hue: 140, sat: 85 },
  ice:   { hue: 190, sat: 90 },
  amber: { hue: 36,  sat: 95 }
};
const theme = THEMES[SETTINGS.theme] || THEMES.grey;

const LEVELS = 24, PAL = [], RGB = [];
function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
for (let i = 0; i < LEVELS; i++) {
  const t = i / (LEVELS - 1);
  const s = Math.round(theme.sat * (1 - t * 0.78)), l = Math.round(18 + t * 72);
  PAL.push(`hsl(${theme.hue},${s}%,${l}%)`);
  RGB.push(hsl2rgb(theme.hue, s, l));
}
const shade = (t, a = 1) => {
  const i = Math.max(0, Math.min(LEVELS - 1, Math.round(t * (LEVELS - 1))));
  const c = RGB[i];
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
};

const base = document.getElementById('base'), over = document.getElementById('over');
const ctx = base.getContext('2d'), octx = over.getContext('2d');
let W, H, DPR, scale, bgSprite;
let mx = 0, my = 0, smx = 0, smy = 0;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const GLYPHS = Array.from('01∂∫∇∑∏πλθφψΩμνσ∞≈≡≠≤≥√Δ±×∈∀∃ℏ{}<>=+-*/^|()[]');
const pick = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];
// colour ramps for the realistic scenes: stops = [[t, [r,g,b]], ...]
const ramp = (stops, t) => {
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [t0, c0] = stops[i - 1], [t1, c1] = stops[i], f = (t - t0) / (t1 - t0 || 1);
    return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];
  }
  return stops[stops.length - 1][1];
};
const mixc = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const toGrey = c => { const l = 0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]; return [l * 0.97, l, l * 1.04]; };
const DARK = l => `hsl(${theme.hue},${Math.min(theme.sat, 10)}%,${l}%)`;   // near-black silhouette fill
// deterministic pseudo-random from an integer (stable shapes every frame)
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const MONO = s => `${(s * scale).toFixed(1)}px Consolas, "Cambria Math", "Segoe UI Symbol", "Courier New", monospace`;
const MATHF = s => `italic ${(s * scale).toFixed(1)}px "Cambria Math", "Times New Roman", serif`;

// Improved Perlin noise (3D)
const PERM = new Uint8Array(512);
(() => {
  const p = []; for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function noise3(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const fd = t => t * t * t * (t * (t * 6 - 15) + 10);
  const u = fd(x), v = fd(y), w = fd(z);
  const grad = (h, x, y, z) => {
    h &= 15; const a = h < 8 ? x : y, b = h < 4 ? y : (h === 12 || h === 14) ? x : z;
    return ((h & 1) ? -a : a) + ((h & 2) ? -b : b);
  };
  const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A + 1] + Z;
  const B = PERM[X + 1] + Y, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;
  return lerp(
    lerp(lerp(grad(PERM[AA], x, y, z), grad(PERM[BA], x - 1, y, z), u),
         lerp(grad(PERM[AB], x, y - 1, z), grad(PERM[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(PERM[AA + 1], x, y, z - 1), grad(PERM[BA + 1], x - 1, y, z - 1), u),
         lerp(grad(PERM[AB + 1], x, y - 1, z - 1), grad(PERM[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}

// Background: dark vertical gradient + soft glow at the scene's focus + vignette
function makeBg() {
  const c = document.createElement('canvas');
  c.width = base.width; c.height = base.height;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const s = Math.min(theme.sat, 12), h = theme.hue;
  const lin = g.createLinearGradient(0, 0, 0, H);
  lin.addColorStop(0, `hsl(${h},${s}%,7%)`);
  lin.addColorStop(1, `hsl(${h},${s}%,2.5%)`);
  g.fillStyle = lin; g.fillRect(0, 0, W, H);
  const fx = SCENE.focus[0] * W, fy = SCENE.focus[1] * H;
  const rad = g.createRadialGradient(fx, fy, 0, fx, fy, Math.max(W, H) * 0.65);
  rad.addColorStop(0, `hsla(${h},${s}%,30%,${SCENE.glow ?? 0.28})`);
  rad.addColorStop(0.35, `hsla(${h},${s}%,16%,0.16)`);
  rad.addColorStop(1, `hsla(${h},${s}%,0%,0)`);
  g.fillStyle = rad; g.fillRect(0, 0, W, H);
  const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
  if (SCENE.ambient !== false) {
    // faint graph-paper dots, with a small cross every fourth point
    const sp = 46 * scale;
    g.fillStyle = PAL[14]; g.strokeStyle = PAL[14]; g.lineWidth = 0.8 * scale;
    for (let i = 0, x = sp / 2; x < W; x += sp, i++) {
      for (let j = 0, y = sp / 2; y < H; y += sp, j++) {
        if (i % 4 === 0 && j % 4 === 0) {
          g.globalAlpha = 0.13;
          g.beginPath(); g.moveTo(x - 3 * scale, y); g.lineTo(x + 3 * scale, y); g.moveTo(x, y - 3 * scale); g.lineTo(x, y + 3 * scale); g.stroke();
        } else { g.globalAlpha = 0.08; g.fillRect(x - 0.6 * scale, y - 0.6 * scale, 1.2 * scale, 1.2 * scale); }
      }
    }
    // rulers along the top and bottom edges
    g.globalAlpha = 0.16;
    g.beginPath();
    for (let k = 0, x = 0; x < W; x += 10 * scale, k++) {
      const L = (k % 10 === 0 ? 9 : k % 5 === 0 ? 5 : 2.5) * scale;
      g.moveTo(x, 0); g.lineTo(x, L); g.moveTo(x, H); g.lineTo(x, H - L);
    }
    g.stroke();
    // corner crop marks
    g.globalAlpha = 0.25;
    const m = 18 * scale, q = 14 * scale;
    g.beginPath();
    for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
      g.moveTo(x, y + sy * q); g.lineTo(x, y); g.lineTo(x + sx * q, y);
    }
    g.stroke();
    g.globalAlpha = 1;
  }
  return c;
}

// drifting faint characters, like dust in the light
const dust = [];
function drawDust(dt) {
  if (SCENE.dust === false) return;
  if (!dust.length) for (let i = 0; i < 30; i++) dust.push({ x: Math.random(), y: Math.random(), vx: rand(-0.004, 0.004), vy: rand(-0.006, -0.0015), g: pick(), a: rand(0.07, 0.18), s: rand(9, 12) });
  const o = octx;
  o.save(); o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = PAL[16];
  for (const d of dust) {
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); d.g = pick(); }
    if (d.x < -0.02) d.x = 1.02; if (d.x > 1.02) d.x = -0.02;
    o.globalAlpha = d.a; o.font = MONO(d.s);
    o.fillText(d.g, d.x * W, d.y * H);
  }
  o.restore();
}

// ---------- Overlay: equations typed out + top-right readout ----------
const EQ_ANCHORS = SCENE.anchors || [[0.30, 0.12], [0.58, 0.08], [0.26, 0.87], [0.60, 0.93], [0.34, 0.32], [0.74, 0.80]];
const eqSlots = [{ eq: -1, anchor: -1, age: 0, dur: 0 }, { eq: -1, anchor: -1, age: -5, dur: 0 }];
let eqNext = (Math.random() * SCENE.eqs.length) | 0;
function eqAssign(s) {
  s.eq = eqNext; eqNext = (eqNext + 1) % SCENE.eqs.length;
  const used = eqSlots.map(o => o.anchor);
  let a; do { a = (Math.random() * EQ_ANCHORS.length) | 0; } while (used.includes(a));
  s.anchor = a;
  s.dur = SCENE.eqs[s.eq].e.length / 20 + 8;
}
function drawOverlay(t, dt) {
  if (!SETTINGS.math) return;
  const o = octx;
  o.save();
  o.textBaseline = 'middle';
  for (const s of eqSlots) {
    if (s.eq < 0) eqAssign(s);
    s.age += dt;
    if (s.age < 0) continue;
    if (s.age > s.dur) { eqAssign(s); s.age = -2; continue; }
    const q = SCENE.eqs[s.eq], n = Math.min(q.e.length, Math.floor(s.age * 20));
    const fade = clamp((s.dur - s.age) / 1.5, 0, 1) * clamp(s.age * 2, 0, 1);
    const x = EQ_ANCHORS[s.anchor][0] * W, y = EQ_ANCHORS[s.anchor][1] * H;
    o.textAlign = 'left';
    o.font = MATHF(15.5);
    o.globalAlpha = 0.8 * fade; o.fillStyle = PAL[20];
    const shown = q.e.slice(0, n);
    o.fillText(shown, x, y);
    if (n < q.e.length) {
      const w = o.measureText(shown).width;
      o.fillRect(x + w + 3 * scale, y - 8 * scale, 1.4 * scale, 16 * scale);
    } else {
      o.font = MONO(10.5); o.fillStyle = PAL[13];
      o.globalAlpha = 0.6 * fade * clamp((s.age - q.e.length / 20) * 1.5, 0, 1);
      o.fillText('— ' + q.n, x, y + 20 * scale);
    }
  }
  o.font = MONO(10.5); o.textAlign = 'right'; o.textBaseline = 'top';
  const hx = W - 28 * scale; let hy = 26 * scale;
  const lines = [[SCENE.title, 0.62, 13], [SCENE.sub, 0.48, 13], ...(SCENE.hud ? SCENE.hud(t).map(l => [l, 0.48, 13]) : []),
                 [`t = ${t.toFixed(2).padStart(9, '0')} s`, 0.75, 20]];
  for (const [txt, al, c] of lines) { o.globalAlpha = al; o.fillStyle = PAL[c]; o.fillText(txt, hx, hy); hy += 16 * scale; }
  o.restore();
}

// ---------- Boot ----------
function setup() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [base, over]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scale = Math.max(0.6, Math.min(W, H) / 1080);
  bgSprite = makeBg();
  ctx.drawImage(bgSprite, 0, 0, W, H);
  SCENE.init();
}

let last = performance.now(), acc = 0, T0 = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  acc += now - last; last = now;
  if (acc < 1000 / SETTINGS.fps - 1) return;
  const dt = Math.min(acc / 1000, 0.1);
  acc = 0;
  const t = (now - T0) / 1000;
  smx += (mx - smx) * 0.05; smy += (my - smy) * 0.05;
  const off = SETTINGS.parallax ? 12 * scale : 0;
  const ox = smx * off, oy = smy * off;
  if (SCENE.update) SCENE.update(dt, t);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = SCENE.trail || 1;
  ctx.drawImage(bgSprite, 0, 0, W, H);
  ctx.globalAlpha = 1;
  SCENE.draw(t, ox, oy);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  octx.clearRect(0, 0, W, H);
  drawDust(dt);
  if (SCENE.drawOver) { octx.save(); SCENE.drawOver(t, ox, oy); octx.restore(); }
  drawOverlay(t, dt);
}
window.addEventListener('mousemove', e => { mx = (e.clientX / W) * 2 - 1; my = (e.clientY / H) * 2 - 1; });
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 200); });
setup();
requestAnimationFrame(loop);

</script>
</body>
</html>
