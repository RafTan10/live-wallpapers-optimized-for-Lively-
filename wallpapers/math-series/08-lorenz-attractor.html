<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lorenz Attractor · Chaos</title>
<!--
  Lorenz Attractor · Chaos — live wallpaper for Lively Wallpaper (grey · mathematical series)
  Add it in Lively: click "+" → choose this file.
  Change the SETTINGS block below with Notepad, save, then re-add in Lively.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="base"></canvas>
<canvas id="over"></canvas>
<script>
// ===================== SETTINGS =====================
const SETTINGS = {
  theme: 'grey',    // 'grey' | 'warm' | 'green' | 'ice' | 'amber'
  math: true,       // equations, labels and readouts (false = clean version)
  parallax: true,   // gentle shift with the mouse
  fps: 30,          // frame cap; 30 keeps the GPU/CPU load low
  speed: 0.55,      // simulation time units per second
  resetEvery: 75,   // seconds before the twin trajectory is re-seeded
};
// ====================================================

// Chaos — the Lorenz attractor. Two trajectories start 10⁻⁵ apart and drift into
// completely different paths: the butterfly effect, with the gap measured live.
const SCENE = {
  focus: [0.62, 0.5],
  title: 'LORENZ SYSTEM · σ = 10  ρ = 28  β = 8/3',
  sub: 'RK4 integration · two trajectories, δ₀ = 10⁻⁵',
  eqs: [
    { e: 'dx/dt = σ (y − x)', n: 'Lorenz (1963)' },
    { e: 'dy/dt = x (ρ − z) − y', n: 'Lorenz (1963)' },
    { e: 'dz/dt = x y − β z', n: 'Lorenz (1963)' },
    { e: 'δ(t) ≈ δ₀ · e^(λt),  λ ≈ 0.906', n: 'largest Lyapunov exponent' },
    { e: 'C± = (±√(β(ρ−1)), ±√(β(ρ−1)), ρ − 1)', n: 'the two unstable fixed points' },
    { e: 'D ≈ 2.06', n: 'fractal dimension of the attractor' }
  ],
  init() {
    this.N = 2600;
    this.S = H * 0.0145;
    const f = (s) => {
      const [x, y, z] = s, sg = 10, r = 28, b = 8 / 3;
      return [sg * (y - x), x * (r - z) - y, x * y - b * z];
    };
    this.f = f;
    let s = [1, 1, 1];
    for (let i = 0; i < 3000; i++) s = this.rk4(s, 0.005);
    // collect successive maxima of z for the Lorenz map z(n+1) vs z(n)
    this.maxima = []; this.zh = [s[2], s[2]];
    let s2 = s;
    for (let i = 0; i < 24000; i++) { s2 = this.rk4(s2, 0.005); this.trackMax(s2[2]); }
    this.A = { s, tr: [] }; this.B = { s: [s[0] + 1e-5, s[1], s[2]], tr: [] };
    for (let i = 0; i < this.N; i++) this.step(0.005);
    this.sinceReset = 0;
    this.gA = pick(); this.gB = pick();
  },
  rk4(s, h) {
    const f = this.f;
    const k1 = f(s), k2 = f(s.map((v, i) => v + h / 2 * k1[i])), k3 = f(s.map((v, i) => v + h / 2 * k2[i])), k4 = f(s.map((v, i) => v + h * k3[i]));
    return s.map((v, i) => v + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
  },
  trackMax(z) {
    const [a, b] = this.zh;
    if (b > a && b > z) { this.maxima.push(b); if (this.maxima.length > 700) this.maxima.shift(); }
    this.zh = [b, z];
  },
  step(h) {
    for (const T of [this.A, this.B]) {
      T.s = this.rk4(T.s, h);
      T.tr.push(T.s); if (T.tr.length > this.N) T.tr.shift();
    }
    this.trackMax(this.A.s[2]);
  },
  update(dt) {
    const steps = Math.round(dt * SETTINGS.speed / 0.005);
    for (let i = 0; i < steps; i++) this.step(0.005);
    this.sinceReset += dt;
    if (this.sinceReset > SETTINGS.resetEvery) {
      this.B.s = [this.A.s[0] + 1e-5, this.A.s[1], this.A.s[2]];
      this.B.tr = this.B.tr.slice(-2);
      this.sinceReset = 0;
    }
    this.delta = Math.hypot(this.A.s[0] - this.B.s[0], this.A.s[1] - this.B.s[1], this.A.s[2] - this.B.s[2]);
  },
  proj(p, rot, cx, cy) {
    const c = Math.cos(rot), s = Math.sin(rot);
    const x = p[0] * c - p[1] * s, y = p[0] * s + p[1] * c, z = p[2] - 25;
    const el = 0.32;
    return [cx + x * this.S, cy - (z * Math.cos(el) - y * Math.sin(el)) * this.S, y];
  },
  drawTrail(tr, rot, cx, cy, lvl, wmul) {
    const n = tr.length, CH = 10;
    for (let c = 0; c < CH; c++) {
      const i0 = Math.floor(n * c / CH), i1 = Math.min(n - 1, Math.floor(n * (c + 1) / CH));
      if (i1 <= i0) continue;
      ctx.beginPath();
      for (let i = i0; i <= i1; i++) {
        const p = this.proj(tr[i], rot, cx, cy);
        i === i0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]);
      }
      const f = (c + 1) / CH;
      ctx.globalAlpha = 0.05 + 0.6 * f * f;
      ctx.strokeStyle = PAL[Math.round(lvl - 6 + 6 * f)];
      ctx.lineWidth = (0.7 + 0.9 * f) * scale * wmul;
      ctx.stroke();
    }
  },
  draw(t, ox, oy) {
    const cx = this.focus[0] * W + ox, cy = this.focus[1] * H + oy, rot = -0.8 + t * 0.04;
    ctx.globalCompositeOperation = 'lighter';
    // floor grid in the plane z = 0
    ctx.lineWidth = 0.7 * scale; ctx.strokeStyle = PAL[13];
    for (let k = -25; k <= 25; k += 5) {
      for (const dir of [0, 1]) {
        const a = this.proj(dir ? [k, -25, 0] : [-25, k, 0], rot, cx, cy), b = this.proj(dir ? [k, 25, 0] : [25, k, 0], rot, cx, cy);
        ctx.globalAlpha = k === 0 ? 0.16 : 0.08;
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
    }
    // vertical z axis through the origin
    const z0 = this.proj([0, 0, 0], rot, cx, cy), z1 = this.proj([0, 0, 50], rot, cx, cy);
    ctx.globalAlpha = 0.12; ctx.setLineDash([2 * scale, 5 * scale]);
    ctx.beginPath(); ctx.moveTo(z0[0], z0[1]); ctx.lineTo(z1[0], z1[1]); ctx.stroke(); ctx.setLineDash([]);
    // Lorenz map inset: successive maxima of z
    const bx = W * 0.25, by = H * 0.56, bs = H * 0.26;
    ctx.globalAlpha = 0.25; ctx.strokeStyle = PAL[14]; ctx.lineWidth = 0.8 * scale;
    ctx.strokeRect(bx, by, bs, bs);
    ctx.globalAlpha = 0.12;
    ctx.beginPath(); ctx.moveTo(bx, by + bs); ctx.lineTo(bx + bs, by); ctx.stroke();
    const zm = v => (v - 29) / (48 - 29);
    ctx.fillStyle = PAL[20];
    const M = this.maxima;
    for (let i = 0; i + 1 < M.length; i++) {
      const x = bx + zm(M[i]) * bs, y = by + bs - zm(M[i + 1]) * bs;
      ctx.globalAlpha = 0.25 + 0.6 * (i / M.length);
      ctx.fillRect(x - 1 * scale, y - 1 * scale, 2 * scale, 2 * scale);
    }
    if (M.length > 2) {
      const x = bx + zm(M[M.length - 2]) * bs, y = by + bs - zm(M[M.length - 1]) * bs;
      ctx.globalAlpha = 0.9; ctx.strokeStyle = PAL[22];
      ctx.beginPath(); ctx.arc(x, y, 4 * scale, 0, TAU); ctx.stroke();
    }
    this.inset = [bx, by, bs];
    // x(t) time series strip
    const tx = W * 0.25, ty = H * 0.25, tw = W * 0.16, th = H * 0.07;
    const tr = this.A.tr, n = Math.min(tr.length, 1400);
    ctx.globalAlpha = 0.15; ctx.strokeStyle = PAL[14];
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + tw, ty); ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const p = tr[tr.length - n + i], x = tx + i / n * tw, y = ty - p[0] / 20 * th;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.globalAlpha = 0.55; ctx.strokeStyle = PAL[19]; ctx.stroke();
    this.strip = [tx, ty, tw, th];
    this.drawTrail(this.B.tr, rot, cx, cy, 16, 0.8);
    this.drawTrail(this.A.tr, rot, cx, cy, 22, 1);
    // fixed points
    const q = Math.sqrt(8 / 3 * 27);
    ctx.font = MONO(11); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const sgn of [1, -1]) {
      const p = this.proj([sgn * q, sgn * q, 27], rot, cx, cy);
      ctx.globalAlpha = 0.6; ctx.fillStyle = PAL[18]; ctx.fillText('+', p[0], p[1]);
    }
    this.hA = this.proj(this.A.s, rot, cx, cy); this.hB = this.proj(this.B.s, rot, cx, cy);
    ctx.globalAlpha = 1; ctx.fillStyle = PAL[23]; ctx.font = MONO(13);
    ctx.fillText(this.gA, this.hA[0], this.hA[1]);
    ctx.globalAlpha = 0.8; ctx.fillStyle = PAL[17];
    ctx.fillText(this.gB, this.hB[0], this.hB[1]);
    this.rot = rot; this.c = [cx, cy];
  },
  drawOver(t) {
    if (!SETTINGS.math || !this.hA) return;
    const o = octx;
    o.strokeStyle = PAL[16]; o.fillStyle = PAL[18]; o.lineWidth = 0.8 * scale;
    o.globalAlpha = 0.45; o.setLineDash([2 * scale, 4 * scale]);
    o.beginPath(); o.moveTo(this.hA[0], this.hA[1]); o.lineTo(this.hB[0], this.hB[1]); o.stroke(); o.setLineDash([]);
    o.font = MONO(10.5); o.textAlign = 'left'; o.textBaseline = 'middle';
    o.globalAlpha = 0.75;
    o.fillText(`δ = ${this.delta.toExponential(2)}`, this.hA[0] + 14 * scale, this.hA[1] - 12 * scale);
    o.globalAlpha = 0.45;
    o.fillText('trajectory A', this.hA[0] + 14 * scale, this.hA[1] + 4 * scale);
    // fixed point labels
    const q = Math.sqrt(8 / 3 * 27), [cx, cy] = this.c;
    for (const [sgn, lbl] of [[1, 'C⁺'], [-1, 'C⁻']]) {
      const p = this.proj([sgn * q, sgn * q, 27], this.rot, cx, cy);
      o.globalAlpha = 0.6; o.fillText(lbl, p[0] + 8 * scale, p[1] - 8 * scale);
    }
    // inset labels
    if (this.inset) {
      const [bx, by, bs] = this.inset;
      o.globalAlpha = 0.6; o.textAlign = 'left'; o.fillStyle = PAL[17];
      o.fillText('LORENZ MAP   zₙ₊₁ vs zₙ  (successive maxima)', bx, by - 14 * scale);
      o.globalAlpha = 0.4;
      o.fillText('29', bx - 4 * scale, by + bs + 12 * scale); o.textAlign = 'right'; o.fillText('48', bx + bs, by + bs + 12 * scale);
      o.fillText('48', bx - 6 * scale, by + 4 * scale);
      o.textAlign = 'left';
      o.fillText(`n = ${this.maxima.length}`, bx + bs + 8 * scale, by + bs - 4 * scale);
      const [tx, ty, tw, th] = this.strip;
      o.globalAlpha = 0.55; o.fillText('x(t)  ·  the switching between wings never repeats', tx, ty - th - 12 * scale);
    }
    // axis gizmo
    const gx = W * 0.9, gy = H * 0.82, L = 32 * scale;
    o.globalAlpha = 0.45;
    for (const [v, n] of [[[1, 0, 25], 'x'], [[0, 1, 25], 'y'], [[0, 0, 26], 'z']]) {
      const p0 = this.proj([0, 0, 25], this.rot, 0, 0), p1 = this.proj(v, this.rot, 0, 0);
      const dx = p1[0] - p0[0], dy = p1[1] - p0[1], m = Math.hypot(dx, dy) || 1;
      o.beginPath(); o.moveTo(gx, gy); o.lineTo(gx + dx / m * L, gy + dy / m * L); o.stroke();
      o.fillText(n, gx + dx / m * (L + 8 * scale), gy + dy / m * (L + 8 * scale));
    }
  },
  hud() { return [`separation |δ| = ${this.delta ? this.delta.toExponential(3) : '—'}`, `re-seeded every ${SETTINGS.resetEvery} s`]; }
};


// ===================== ENGINE (shared) =====================
const THEMES = {
  grey:  { hue: 220, sat: 7 },
  warm:  { hue: 30, sat: 45 },
  green: { hue: 140, sat: 85 },
  ice:   { hue: 190, sat: 90 },
  amber: { hue: 36,  sat: 95 }
};
const theme = THEMES[SETTINGS.theme] || THEMES.grey;

const LEVELS = 24, PAL = [], RGB = [];
function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
for (let i = 0; i < LEVELS; i++) {
  const t = i / (LEVELS - 1);
  const s = Math.round(theme.sat * (1 - t * 0.78)), l = Math.round(18 + t * 72);
  PAL.push(`hsl(${theme.hue},${s}%,${l}%)`);
  RGB.push(hsl2rgb(theme.hue, s, l));
}
const shade = (t, a = 1) => {
  const i = Math.max(0, Math.min(LEVELS - 1, Math.round(t * (LEVELS - 1))));
  const c = RGB[i];
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
};

const base = document.getElementById('base'), over = document.getElementById('over');
const ctx = base.getContext('2d'), octx = over.getContext('2d');
let W, H, DPR, scale, bgSprite;
let mx = 0, my = 0, smx = 0, smy = 0;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const GLYPHS = Array.from('01∂∫∇∑∏πλθφψΩμνσ∞≈≡≠≤≥√Δ±×∈∀∃ℏ{}<>=+-*/^|()[]');
const pick = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];
// colour ramps for the realistic scenes: stops = [[t, [r,g,b]], ...]
const ramp = (stops, t) => {
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [t0, c0] = stops[i - 1], [t1, c1] = stops[i], f = (t - t0) / (t1 - t0 || 1);
    return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];
  }
  return stops[stops.length - 1][1];
};
const mixc = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const toGrey = c => { const l = 0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]; return [l * 0.97, l, l * 1.04]; };
const DARK = l => `hsl(${theme.hue},${Math.min(theme.sat, 10)}%,${l}%)`;   // near-black silhouette fill
// deterministic pseudo-random from an integer (stable shapes every frame)
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const MONO = s => `${(s * scale).toFixed(1)}px Consolas, "Cambria Math", "Segoe UI Symbol", "Courier New", monospace`;
const MATHF = s => `italic ${(s * scale).toFixed(1)}px "Cambria Math", "Times New Roman", serif`;

// Improved Perlin noise (3D)
const PERM = new Uint8Array(512);
(() => {
  const p = []; for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function noise3(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const fd = t => t * t * t * (t * (t * 6 - 15) + 10);
  const u = fd(x), v = fd(y), w = fd(z);
  const grad = (h, x, y, z) => {
    h &= 15; const a = h < 8 ? x : y, b = h < 4 ? y : (h === 12 || h === 14) ? x : z;
    return ((h & 1) ? -a : a) + ((h & 2) ? -b : b);
  };
  const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A + 1] + Z;
  const B = PERM[X + 1] + Y, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;
  return lerp(
    lerp(lerp(grad(PERM[AA], x, y, z), grad(PERM[BA], x - 1, y, z), u),
         lerp(grad(PERM[AB], x, y - 1, z), grad(PERM[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(PERM[AA + 1], x, y, z - 1), grad(PERM[BA + 1], x - 1, y, z - 1), u),
         lerp(grad(PERM[AB + 1], x, y - 1, z - 1), grad(PERM[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}

// Background: dark vertical gradient + soft glow at the scene's focus + vignette
function makeBg() {
  const c = document.createElement('canvas');
  c.width = base.width; c.height = base.height;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const s = Math.min(theme.sat, 12), h = theme.hue;
  const lin = g.createLinearGradient(0, 0, 0, H);
  lin.addColorStop(0, `hsl(${h},${s}%,7%)`);
  lin.addColorStop(1, `hsl(${h},${s}%,2.5%)`);
  g.fillStyle = lin; g.fillRect(0, 0, W, H);
  const fx = SCENE.focus[0] * W, fy = SCENE.focus[1] * H;
  const rad = g.createRadialGradient(fx, fy, 0, fx, fy, Math.max(W, H) * 0.65);
  rad.addColorStop(0, `hsla(${h},${s}%,30%,${SCENE.glow ?? 0.28})`);
  rad.addColorStop(0.35, `hsla(${h},${s}%,16%,0.16)`);
  rad.addColorStop(1, `hsla(${h},${s}%,0%,0)`);
  g.fillStyle = rad; g.fillRect(0, 0, W, H);
  const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
  if (SCENE.ambient !== false) {
    // faint graph-paper dots, with a small cross every fourth point
    const sp = 46 * scale;
    g.fillStyle = PAL[14]; g.strokeStyle = PAL[14]; g.lineWidth = 0.8 * scale;
    for (let i = 0, x = sp / 2; x < W; x += sp, i++) {
      for (let j = 0, y = sp / 2; y < H; y += sp, j++) {
        if (i % 4 === 0 && j % 4 === 0) {
          g.globalAlpha = 0.13;
          g.beginPath(); g.moveTo(x - 3 * scale, y); g.lineTo(x + 3 * scale, y); g.moveTo(x, y - 3 * scale); g.lineTo(x, y + 3 * scale); g.stroke();
        } else { g.globalAlpha = 0.08; g.fillRect(x - 0.6 * scale, y - 0.6 * scale, 1.2 * scale, 1.2 * scale); }
      }
    }
    // rulers along the top and bottom edges
    g.globalAlpha = 0.16;
    g.beginPath();
    for (let k = 0, x = 0; x < W; x += 10 * scale, k++) {
      const L = (k % 10 === 0 ? 9 : k % 5 === 0 ? 5 : 2.5) * scale;
      g.moveTo(x, 0); g.lineTo(x, L); g.moveTo(x, H); g.lineTo(x, H - L);
    }
    g.stroke();
    // corner crop marks
    g.globalAlpha = 0.25;
    const m = 18 * scale, q = 14 * scale;
    g.beginPath();
    for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
      g.moveTo(x, y + sy * q); g.lineTo(x, y); g.lineTo(x + sx * q, y);
    }
    g.stroke();
    g.globalAlpha = 1;
  }
  return c;
}

// drifting faint characters, like dust in the light
const dust = [];
function drawDust(dt) {
  if (SCENE.dust === false) return;
  if (!dust.length) for (let i = 0; i < 30; i++) dust.push({ x: Math.random(), y: Math.random(), vx: rand(-0.004, 0.004), vy: rand(-0.006, -0.0015), g: pick(), a: rand(0.07, 0.18), s: rand(9, 12) });
  const o = octx;
  o.save(); o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = PAL[16];
  for (const d of dust) {
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); d.g = pick(); }
    if (d.x < -0.02) d.x = 1.02; if (d.x > 1.02) d.x = -0.02;
    o.globalAlpha = d.a; o.font = MONO(d.s);
    o.fillText(d.g, d.x * W, d.y * H);
  }
  o.restore();
}

// ---------- Overlay: equations typed out + top-right readout ----------
const EQ_ANCHORS = SCENE.anchors || [[0.30, 0.12], [0.58, 0.08], [0.26, 0.87], [0.60, 0.93], [0.34, 0.32], [0.74, 0.80]];
const eqSlots = [{ eq: -1, anchor: -1, age: 0, dur: 0 }, { eq: -1, anchor: -1, age: -5, dur: 0 }];
let eqNext = (Math.random() * SCENE.eqs.length) | 0;
function eqAssign(s) {
  s.eq = eqNext; eqNext = (eqNext + 1) % SCENE.eqs.length;
  const used = eqSlots.map(o => o.anchor);
  let a; do { a = (Math.random() * EQ_ANCHORS.length) | 0; } while (used.includes(a));
  s.anchor = a;
  s.dur = SCENE.eqs[s.eq].e.length / 20 + 8;
}
function drawOverlay(t, dt) {
  if (!SETTINGS.math) return;
  const o = octx;
  o.save();
  o.textBaseline = 'middle';
  for (const s of eqSlots) {
    if (s.eq < 0) eqAssign(s);
    s.age += dt;
    if (s.age < 0) continue;
    if (s.age > s.dur) { eqAssign(s); s.age = -2; continue; }
    const q = SCENE.eqs[s.eq], n = Math.min(q.e.length, Math.floor(s.age * 20));
    const fade = clamp((s.dur - s.age) / 1.5, 0, 1) * clamp(s.age * 2, 0, 1);
    const x = EQ_ANCHORS[s.anchor][0] * W, y = EQ_ANCHORS[s.anchor][1] * H;
    o.textAlign = 'left';
    o.font = MATHF(15.5);
    o.globalAlpha = 0.8 * fade; o.fillStyle = PAL[20];
    const shown = q.e.slice(0, n);
    o.fillText(shown, x, y);
    if (n < q.e.length) {
      const w = o.measureText(shown).width;
      o.fillRect(x + w + 3 * scale, y - 8 * scale, 1.4 * scale, 16 * scale);
    } else {
      o.font = MONO(10.5); o.fillStyle = PAL[13];
      o.globalAlpha = 0.6 * fade * clamp((s.age - q.e.length / 20) * 1.5, 0, 1);
      o.fillText('— ' + q.n, x, y + 20 * scale);
    }
  }
  o.font = MONO(10.5); o.textAlign = 'right'; o.textBaseline = 'top';
  const hx = W - 28 * scale; let hy = 26 * scale;
  const lines = [[SCENE.title, 0.62, 13], [SCENE.sub, 0.48, 13], ...(SCENE.hud ? SCENE.hud(t).map(l => [l, 0.48, 13]) : []),
                 [`t = ${t.toFixed(2).padStart(9, '0')} s`, 0.75, 20]];
  for (const [txt, al, c] of lines) { o.globalAlpha = al; o.fillStyle = PAL[c]; o.fillText(txt, hx, hy); hy += 16 * scale; }
  o.restore();
}

// ---------- Boot ----------
function setup() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [base, over]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scale = Math.max(0.6, Math.min(W, H) / 1080);
  bgSprite = makeBg();
  ctx.drawImage(bgSprite, 0, 0, W, H);
  SCENE.init();
}

let last = performance.now(), acc = 0, T0 = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  acc += now - last; last = now;
  if (acc < 1000 / SETTINGS.fps - 1) return;
  const dt = Math.min(acc / 1000, 0.1);
  acc = 0;
  const t = (now - T0) / 1000;
  smx += (mx - smx) * 0.05; smy += (my - smy) * 0.05;
  const off = SETTINGS.parallax ? 12 * scale : 0;
  const ox = smx * off, oy = smy * off;
  if (SCENE.update) SCENE.update(dt, t);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = SCENE.trail || 1;
  ctx.drawImage(bgSprite, 0, 0, W, H);
  ctx.globalAlpha = 1;
  SCENE.draw(t, ox, oy);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  octx.clearRect(0, 0, W, H);
  drawDust(dt);
  if (SCENE.drawOver) { octx.save(); SCENE.drawOver(t, ox, oy); octx.restore(); }
  drawOverlay(t, dt);
}
window.addEventListener('mousemove', e => { mx = (e.clientX / W) * 2 - 1; my = (e.clientY / H) * 2 - 1; });
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 200); });
setup();
requestAnimationFrame(loop);

</script>
</body>
</html>
