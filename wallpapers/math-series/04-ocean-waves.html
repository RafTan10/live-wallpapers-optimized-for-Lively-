<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moonlit Ocean · Deep-Water Waves</title>
<!--
  Moonlit Ocean · Deep-Water Waves — live wallpaper for Lively Wallpaper (grey · mathematical series)
  Add it in Lively: click "+" → choose this file.
  Change the SETTINGS block below with Notepad, save, then re-add in Lively.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="base"></canvas>
<canvas id="over"></canvas>
<script>
// ===================== SETTINGS =====================
const SETTINGS = {
  theme: 'grey',    // 'grey' | 'warm' | 'green' | 'ice' | 'amber'
  math: true,       // equations, labels and readouts (false = clean version)
  parallax: true,   // gentle shift with the mouse
  fps: 30,          // frame cap; 30 keeps the GPU/CPU load low
  density: 1.0,     // number of wave lines
};
// ====================================================

// Ocean — a moonlit sea built from a sum of deep-water waves (ω² = g k), seen in perspective,
// under a starry sky with the Milky Way. Starlight twinkles on the wave crests.
const SCENE = {
  ambient: false,
  dust: false,
  focus: [0.72, 0.3],
  glow: 0.22,
  anchors: [[0.30, 0.10], [0.50, 0.20], [0.26, 0.36], [0.40, 0.08], [0.30, 0.25], [0.52, 0.34]],
  title: 'DEEP-WATER WAVES · LINEAR THEORY',
  sub: 'g = 9.81 m/s² · 5 superposed components',
  eqs: [
    { e: 'ω² = g k', n: 'deep-water dispersion relation' },
    { e: 'η(x, t) = Σ Aₙ cos(kₙ · x − ωₙ t + φₙ)', n: 'sea surface as a sum of waves' },
    { e: 'c = ω / k = √(g / k)', n: 'phase speed — long waves travel faster' },
    { e: 'c_g = c / 2', n: 'group velocity in deep water' },
    { e: 'λ = 2π / k', n: 'wavelength' },
    { e: 'θᵢ = θᵣ', n: 'law of reflection — why the glints line up under the moon' }
  ],
  init() {
    this.horizon = H * 0.52;
    this.rows = Math.round(48 * SETTINGS.density);
    this.waves = [];
    const L = [42, 27, 17, 11, 7];
    for (let i = 0; i < L.length; i++) {
      const k = TAU / L[i], dir = rand(-0.5, 0.5) + Math.PI / 2;
      this.waves.push({ k, w: Math.sqrt(9.81 * k), A: 0.55 * Math.pow(L[i] / 42, 0.8), cx: Math.cos(dir), cz: Math.sin(dir), p: rand(0, TAU), L: L[i] });
    }
    // sky: faint stars, a Milky Way band, and a few bright twinkling stars
    this.stars = [];
    for (let i = 0; i < 300; i++) this.stars.push({ x: Math.random(), y: Math.pow(Math.random(), 1.3) * 0.97, a: rand(0.08, 0.5), s: rand(0.8, 1.8), ph: rand(0, TAU), f: rand(0.2, 0.7) });
    this.milky = [];
    for (let i = 0; i < 700; i++) {
      const u = Math.random(), off = (Math.random() + Math.random() + Math.random() - 1.5) * 0.09;
      const x = u, y = 0.08 + 0.75 * u + off * 1.4;          // diagonal band across the sky
      if (y > 0 && y < 0.98) this.milky.push({ x, y, a: rand(0.1, 0.38) * Math.max(0.15, 1 - Math.abs(off) * 5) });
    }
    this.bright = [];
    for (let i = 0; i < 16; i++) this.bright.push({ x: rand(0.05, 0.98), y: rand(0.05, 0.85), s: rand(3, 7), ph: rand(0, TAU), f: rand(0.25, 0.6) });
    // sparkles that ride the wave crests
    this.sparks = [];
    for (let i = 0; i < 170; i++) this.sparks.push({ row: Math.floor(Math.pow(Math.random(), 0.7) * this.rows), x: Math.random(), ph: rand(0, TAU), f: rand(0.3, 0.9), s: rand(1.5, 4.5) });
    this.riders = [];
    for (let i = 0; i < 46; i++) this.riders.push({ row: Math.floor(rand(0.45, 1) * this.rows), x: Math.random(), g: pick(), a: rand(0.3, 0.8) });
    this.meteor = null; this.nextMeteor = rand(8, 20);
  },
  eta(X, Z, t) {
    let s = 0;
    for (const w of this.waves) s += w.A * Math.cos(w.k * (X * w.cx + Z * w.cz) - w.w * t + w.p);
    return s;
  },
  update(dt, t) {
    for (const r of this.riders) { r.x += dt * 0.006; if (r.x > 1) { r.x = 0; r.g = pick(); } }
    for (const s of this.sparks) { s.x += dt * 0.004; if (s.x > 1) s.x = 0; }
    this.nextMeteor -= dt;
    if (this.nextMeteor <= 0 && !this.meteor) {
      this.meteor = { x: rand(0.1, 0.6), y: rand(0.05, 0.25), vx: rand(0.12, 0.2), vy: rand(0.05, 0.09), age: 0, life: 1.6 };
      this.nextMeteor = rand(18, 35);
    }
    if (this.meteor) { this.meteor.age += dt; if (this.meteor.age > this.meteor.life) this.meteor = null; }
  },
  rowGeom(i) {
    const p = Math.pow((i + 1) / this.rows, 1.9);
    return { p, y0: this.horizon + (H * 1.04 - this.horizon) * p, Z: 30 / p };
  },
  surfY(row, sx, t, oy) {
    const g = this.rowGeom(row), X = (sx - W * 0.5) / (g.p * W) * 110;
    return { y: g.y0 - this.eta(X, g.Z, t) * H * 0.045 * g.p + oy * g.p, e: this.eta(X, g.Z, t), p: g.p };
  },
  sparkle(x, y, s, a, lvl) {
    ctx.globalAlpha = a; ctx.strokeStyle = PAL[lvl]; ctx.fillStyle = PAL[lvl];
    ctx.beginPath(); ctx.moveTo(x - s, y); ctx.lineTo(x + s, y); ctx.moveTo(x, y - s); ctx.lineTo(x, y + s); ctx.stroke();
    ctx.fillRect(x - 0.8 * scale, y - 0.8 * scale, 1.6 * scale, 1.6 * scale);
  },
  draw(t, ox, oy) {
    const mxp = this.focus[0] * W + ox * 0.5, myp = this.focus[1] * H + oy * 0.5, mr = H * 0.055;
    const hz = this.horizon;
    ctx.globalCompositeOperation = 'lighter';
    // Milky Way
    ctx.fillStyle = PAL[19];
    for (const m of this.milky) { ctx.globalAlpha = m.a; ctx.fillRect(m.x * W, m.y * hz, 1.1 * scale, 1.1 * scale); }
    // stars
    for (const s of this.stars) {
      ctx.globalAlpha = s.a * (0.7 + 0.3 * Math.sin(t * s.f + s.ph));
      ctx.fillStyle = PAL[19];
      ctx.fillRect(s.x * W, s.y * hz, s.s * scale, s.s * scale);
    }
    ctx.lineWidth = 0.9 * scale;
    for (const b of this.bright) {
      const tw = 0.6 + 0.4 * Math.sin(t * b.f + b.ph);
      this.sparkle(b.x * W, b.y * hz, b.s * tw * scale, 0.45 + 0.4 * tw, 22);
    }
    // shooting star
    if (this.meteor) {
      const m = this.meteor, k = m.age / m.life, x = (m.x + m.vx * m.age) * W, y = (m.y + m.vy * m.age) * hz;
      const g = ctx.createLinearGradient(x, y, x - m.vx * W * 0.5, y - m.vy * hz * 0.5);
      g.addColorStop(0, shade(1, 0.6 * Math.sin(Math.PI * k))); g.addColorStop(1, shade(0.6, 0));
      ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 1.3 * scale;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - m.vx * W * 0.5, y - m.vy * hz * 0.5); ctx.stroke();
    }
    // moon
    const mg = ctx.createRadialGradient(mxp - mr * 0.3, myp - mr * 0.3, 0, mxp, myp, mr);
    mg.addColorStop(0, shade(0.95, 0.55)); mg.addColorStop(1, shade(0.6, 0.18));
    ctx.globalAlpha = 1; ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(mxp, myp, mr, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.7; ctx.strokeStyle = PAL[22]; ctx.lineWidth = 1.2 * scale;
    ctx.beginPath(); ctx.arc(mxp, myp, mr, 0, TAU); ctx.stroke();
    // a few craters
    ctx.globalAlpha = 0.25; ctx.strokeStyle = PAL[14]; ctx.lineWidth = 0.8 * scale;
    for (const [dx, dy, r] of [[-0.3, -0.1, 0.18], [0.25, 0.3, 0.12], [0.1, -0.4, 0.09], [-0.2, 0.42, 0.08]]) {
      ctx.beginPath(); ctx.arc(mxp + dx * mr, myp + dy * mr, r * mr, 0, TAU); ctx.stroke();
    }
    // horizon
    ctx.globalAlpha = 0.35; ctx.strokeStyle = PAL[14]; ctx.lineWidth = 0.8 * scale;
    ctx.beginPath(); ctx.moveTo(0, hz); ctx.lineTo(W, hz); ctx.stroke();
    // soft glow on the water below the moon
    const rg = ctx.createRadialGradient(mxp, hz + H * 0.18, 0, mxp, hz + H * 0.18, H * 0.35);
    rg.addColorStop(0, shade(0.8, 0.07)); rg.addColorStop(1, shade(0.6, 0));
    ctx.globalAlpha = 1; ctx.fillStyle = rg;
    ctx.fillRect(0, hz, W, H - hz);
    // sea surface lines
    const step = 10 * scale;
    for (let i = 0; i < this.rows; i++) {
      const g = this.rowGeom(i), amp = H * 0.045 * g.p;
      const glintW = W * (0.015 + 0.09 * g.p);
      ctx.lineWidth = (0.6 + 0.8 * g.p) * scale;
      ctx.strokeStyle = PAL[Math.round(8 + 10 * g.p)];
      const gw = (1.2 + 1.6 * g.p) * scale;
      ctx.globalAlpha = 0.18 + 0.5 * g.p;
      ctx.beginPath();
      const pts = [];
      for (let sx = -step; sx <= W + step; sx += step) {
        const X = (sx - W * 0.5) / (g.p * W) * 110;
        const y = g.y0 - this.eta(X, g.Z, t) * amp + oy * g.p;
        pts.push(sx, y);
        sx > -step ? ctx.lineTo(sx, y) : ctx.moveTo(sx, y);
      }
      ctx.stroke();
      ctx.strokeStyle = PAL[22];
      for (let k = 2; k < pts.length; k += 2) {
        const sx = pts[k], dxm = Math.abs(sx - mxp);
        if (dxm > glintW) continue;
        const slope = pts[k + 1] - pts[k - 1];
        const gl = Math.pow(clamp(0.5 + slope / (amp * 0.5 + 1), 0, 1), 3) * (1 - dxm / glintW);
        if (gl < 0.05) continue;
        ctx.globalAlpha = gl * (0.5 + 0.5 * g.p); ctx.lineWidth = gw;
        ctx.beginPath(); ctx.moveTo(pts[k - 2], pts[k - 1]); ctx.lineTo(sx, pts[k + 1]); ctx.stroke();
      }
    }
    // reflections of the bright stars: little twinkles straight below each star
    ctx.lineWidth = 0.8 * scale;
    for (const b of this.bright) {
      const sx = b.x * W;
      for (let i = 4; i < this.rows * 0.75; i += 3) {
        const s = this.surfY(i, sx + Math.sin(i * 1.7 + t * 0.4) * 4 * scale, t, oy);
        const tw = 0.5 + 0.5 * Math.sin(t * (b.f + i * 0.03) + b.ph + i);
        if (tw < 0.35) continue;
        this.sparkle(sx, s.y - 1.5 * scale, (1 + 2.2 * s.p) * tw * scale, 0.3 * tw * (0.4 + s.p), 21);
      }
    }
    // starlight sparkles on the crests
    for (const sp of this.sparks) {
      const sx = sp.x * W, s = this.surfY(sp.row, sx, t, oy);
      const crest = clamp((s.e - 0.15) / 0.9, 0, 1);
      if (crest <= 0) continue;
      const tw = 0.5 + 0.5 * Math.sin(t * sp.f + sp.ph);
      this.sparkle(sx, s.y - 2 * scale, sp.s * (0.4 + s.p) * tw * scale, crest * tw * (0.35 + 0.55 * s.p), 22);
    }
    // glyphs riding the swell
    ctx.font = MONO(11); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    for (const r of this.riders) {
      const s = this.surfY(r.row, r.x * W, t, oy);
      ctx.globalAlpha = r.a * s.p * clamp(Math.sin(Math.PI * r.x) * 3, 0, 1);
      ctx.fillStyle = PAL[19];
      ctx.fillText(r.g, r.x * W, s.y - 3 * scale);
    }
  },
  drawOver(t) {
    if (!SETTINGS.math) return;
    const o = octx;
    const x0 = W * 0.76, y0 = H * 0.62;
    o.font = MONO(10); o.textBaseline = 'middle'; o.textAlign = 'left';
    o.strokeStyle = PAL[14]; o.fillStyle = PAL[16]; o.lineWidth = 0.8 * scale;
    o.globalAlpha = 0.6;
    o.fillText('component   λ (m)   c (m/s)', x0, y0);
    this.waves.forEach((w, i) => {
      const y = y0 + (i + 1) * 16 * scale;
      o.globalAlpha = 0.5;
      o.fillText(`  n=${i + 1}       ${String(w.L).padStart(3)}     ${(w.w / w.k).toFixed(2)}`, x0, y);
    });
    const mxp = this.focus[0] * W, myp = this.focus[1] * H, mr = H * 0.055;
    o.globalAlpha = 0.45;
    o.beginPath(); o.moveTo(mxp + mr * 0.8, myp - mr * 0.8); o.lineTo(mxp + mr * 1.8, myp - mr * 1.6); o.lineTo(mxp + mr * 2.3, myp - mr * 1.6); o.stroke();
    o.globalAlpha = 0.65;
    o.fillText('glint where surface slope reflects the moon', mxp + mr * 2.45, myp - mr * 1.6);
  },
  hud() { return [`surface sampled every 10 px · ${this.rows} depth rows`]; }
};


// ===================== ENGINE (shared) =====================
const THEMES = {
  grey:  { hue: 220, sat: 7 },
  warm:  { hue: 30, sat: 45 },
  green: { hue: 140, sat: 85 },
  ice:   { hue: 190, sat: 90 },
  amber: { hue: 36,  sat: 95 }
};
const theme = THEMES[SETTINGS.theme] || THEMES.grey;

const LEVELS = 24, PAL = [], RGB = [];
function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
for (let i = 0; i < LEVELS; i++) {
  const t = i / (LEVELS - 1);
  const s = Math.round(theme.sat * (1 - t * 0.78)), l = Math.round(18 + t * 72);
  PAL.push(`hsl(${theme.hue},${s}%,${l}%)`);
  RGB.push(hsl2rgb(theme.hue, s, l));
}
const shade = (t, a = 1) => {
  const i = Math.max(0, Math.min(LEVELS - 1, Math.round(t * (LEVELS - 1))));
  const c = RGB[i];
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
};

const base = document.getElementById('base'), over = document.getElementById('over');
const ctx = base.getContext('2d'), octx = over.getContext('2d');
let W, H, DPR, scale, bgSprite;
let mx = 0, my = 0, smx = 0, smy = 0;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const GLYPHS = Array.from('01∂∫∇∑∏πλθφψΩμνσ∞≈≡≠≤≥√Δ±×∈∀∃ℏ{}<>=+-*/^|()[]');
const pick = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];
// colour ramps for the realistic scenes: stops = [[t, [r,g,b]], ...]
const ramp = (stops, t) => {
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [t0, c0] = stops[i - 1], [t1, c1] = stops[i], f = (t - t0) / (t1 - t0 || 1);
    return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];
  }
  return stops[stops.length - 1][1];
};
const mixc = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const toGrey = c => { const l = 0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]; return [l * 0.97, l, l * 1.04]; };
const DARK = l => `hsl(${theme.hue},${Math.min(theme.sat, 10)}%,${l}%)`;   // near-black silhouette fill
// deterministic pseudo-random from an integer (stable shapes every frame)
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const MONO = s => `${(s * scale).toFixed(1)}px Consolas, "Cambria Math", "Segoe UI Symbol", "Courier New", monospace`;
const MATHF = s => `italic ${(s * scale).toFixed(1)}px "Cambria Math", "Times New Roman", serif`;

// Improved Perlin noise (3D)
const PERM = new Uint8Array(512);
(() => {
  const p = []; for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function noise3(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const fd = t => t * t * t * (t * (t * 6 - 15) + 10);
  const u = fd(x), v = fd(y), w = fd(z);
  const grad = (h, x, y, z) => {
    h &= 15; const a = h < 8 ? x : y, b = h < 4 ? y : (h === 12 || h === 14) ? x : z;
    return ((h & 1) ? -a : a) + ((h & 2) ? -b : b);
  };
  const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A + 1] + Z;
  const B = PERM[X + 1] + Y, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;
  return lerp(
    lerp(lerp(grad(PERM[AA], x, y, z), grad(PERM[BA], x - 1, y, z), u),
         lerp(grad(PERM[AB], x, y - 1, z), grad(PERM[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(PERM[AA + 1], x, y, z - 1), grad(PERM[BA + 1], x - 1, y, z - 1), u),
         lerp(grad(PERM[AB + 1], x, y - 1, z - 1), grad(PERM[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}

// Background: dark vertical gradient + soft glow at the scene's focus + vignette
function makeBg() {
  const c = document.createElement('canvas');
  c.width = base.width; c.height = base.height;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const s = Math.min(theme.sat, 12), h = theme.hue;
  const lin = g.createLinearGradient(0, 0, 0, H);
  lin.addColorStop(0, `hsl(${h},${s}%,7%)`);
  lin.addColorStop(1, `hsl(${h},${s}%,2.5%)`);
  g.fillStyle = lin; g.fillRect(0, 0, W, H);
  const fx = SCENE.focus[0] * W, fy = SCENE.focus[1] * H;
  const rad = g.createRadialGradient(fx, fy, 0, fx, fy, Math.max(W, H) * 0.65);
  rad.addColorStop(0, `hsla(${h},${s}%,30%,${SCENE.glow ?? 0.28})`);
  rad.addColorStop(0.35, `hsla(${h},${s}%,16%,0.16)`);
  rad.addColorStop(1, `hsla(${h},${s}%,0%,0)`);
  g.fillStyle = rad; g.fillRect(0, 0, W, H);
  const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
  if (SCENE.ambient !== false) {
    // faint graph-paper dots, with a small cross every fourth point
    const sp = 46 * scale;
    g.fillStyle = PAL[14]; g.strokeStyle = PAL[14]; g.lineWidth = 0.8 * scale;
    for (let i = 0, x = sp / 2; x < W; x += sp, i++) {
      for (let j = 0, y = sp / 2; y < H; y += sp, j++) {
        if (i % 4 === 0 && j % 4 === 0) {
          g.globalAlpha = 0.13;
          g.beginPath(); g.moveTo(x - 3 * scale, y); g.lineTo(x + 3 * scale, y); g.moveTo(x, y - 3 * scale); g.lineTo(x, y + 3 * scale); g.stroke();
        } else { g.globalAlpha = 0.08; g.fillRect(x - 0.6 * scale, y - 0.6 * scale, 1.2 * scale, 1.2 * scale); }
      }
    }
    // rulers along the top and bottom edges
    g.globalAlpha = 0.16;
    g.beginPath();
    for (let k = 0, x = 0; x < W; x += 10 * scale, k++) {
      const L = (k % 10 === 0 ? 9 : k % 5 === 0 ? 5 : 2.5) * scale;
      g.moveTo(x, 0); g.lineTo(x, L); g.moveTo(x, H); g.lineTo(x, H - L);
    }
    g.stroke();
    // corner crop marks
    g.globalAlpha = 0.25;
    const m = 18 * scale, q = 14 * scale;
    g.beginPath();
    for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
      g.moveTo(x, y + sy * q); g.lineTo(x, y); g.lineTo(x + sx * q, y);
    }
    g.stroke();
    g.globalAlpha = 1;
  }
  return c;
}

// drifting faint characters, like dust in the light
const dust = [];
function drawDust(dt) {
  if (SCENE.dust === false) return;
  if (!dust.length) for (let i = 0; i < 30; i++) dust.push({ x: Math.random(), y: Math.random(), vx: rand(-0.004, 0.004), vy: rand(-0.006, -0.0015), g: pick(), a: rand(0.07, 0.18), s: rand(9, 12) });
  const o = octx;
  o.save(); o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = PAL[16];
  for (const d of dust) {
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); d.g = pick(); }
    if (d.x < -0.02) d.x = 1.02; if (d.x > 1.02) d.x = -0.02;
    o.globalAlpha = d.a; o.font = MONO(d.s);
    o.fillText(d.g, d.x * W, d.y * H);
  }
  o.restore();
}

// ---------- Overlay: equations typed out + top-right readout ----------
const EQ_ANCHORS = SCENE.anchors || [[0.30, 0.12], [0.58, 0.08], [0.26, 0.87], [0.60, 0.93], [0.34, 0.32], [0.74, 0.80]];
const eqSlots = [{ eq: -1, anchor: -1, age: 0, dur: 0 }, { eq: -1, anchor: -1, age: -5, dur: 0 }];
let eqNext = (Math.random() * SCENE.eqs.length) | 0;
function eqAssign(s) {
  s.eq = eqNext; eqNext = (eqNext + 1) % SCENE.eqs.length;
  const used = eqSlots.map(o => o.anchor);
  let a; do { a = (Math.random() * EQ_ANCHORS.length) | 0; } while (used.includes(a));
  s.anchor = a;
  s.dur = SCENE.eqs[s.eq].e.length / 20 + 8;
}
function drawOverlay(t, dt) {
  if (!SETTINGS.math) return;
  const o = octx;
  o.save();
  o.textBaseline = 'middle';
  for (const s of eqSlots) {
    if (s.eq < 0) eqAssign(s);
    s.age += dt;
    if (s.age < 0) continue;
    if (s.age > s.dur) { eqAssign(s); s.age = -2; continue; }
    const q = SCENE.eqs[s.eq], n = Math.min(q.e.length, Math.floor(s.age * 20));
    const fade = clamp((s.dur - s.age) / 1.5, 0, 1) * clamp(s.age * 2, 0, 1);
    const x = EQ_ANCHORS[s.anchor][0] * W, y = EQ_ANCHORS[s.anchor][1] * H;
    o.textAlign = 'left';
    o.font = MATHF(15.5);
    o.globalAlpha = 0.8 * fade; o.fillStyle = PAL[20];
    const shown = q.e.slice(0, n);
    o.fillText(shown, x, y);
    if (n < q.e.length) {
      const w = o.measureText(shown).width;
      o.fillRect(x + w + 3 * scale, y - 8 * scale, 1.4 * scale, 16 * scale);
    } else {
      o.font = MONO(10.5); o.fillStyle = PAL[13];
      o.globalAlpha = 0.6 * fade * clamp((s.age - q.e.length / 20) * 1.5, 0, 1);
      o.fillText('— ' + q.n, x, y + 20 * scale);
    }
  }
  o.font = MONO(10.5); o.textAlign = 'right'; o.textBaseline = 'top';
  const hx = W - 28 * scale; let hy = 26 * scale;
  const lines = [[SCENE.title, 0.62, 13], [SCENE.sub, 0.48, 13], ...(SCENE.hud ? SCENE.hud(t).map(l => [l, 0.48, 13]) : []),
                 [`t = ${t.toFixed(2).padStart(9, '0')} s`, 0.75, 20]];
  for (const [txt, al, c] of lines) { o.globalAlpha = al; o.fillStyle = PAL[c]; o.fillText(txt, hx, hy); hy += 16 * scale; }
  o.restore();
}

// ---------- Boot ----------
function setup() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [base, over]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scale = Math.max(0.6, Math.min(W, H) / 1080);
  bgSprite = makeBg();
  ctx.drawImage(bgSprite, 0, 0, W, H);
  SCENE.init();
}

let last = performance.now(), acc = 0, T0 = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  acc += now - last; last = now;
  if (acc < 1000 / SETTINGS.fps - 1) return;
  const dt = Math.min(acc / 1000, 0.1);
  acc = 0;
  const t = (now - T0) / 1000;
  smx += (mx - smx) * 0.05; smy += (my - smy) * 0.05;
  const off = SETTINGS.parallax ? 12 * scale : 0;
  const ox = smx * off, oy = smy * off;
  if (SCENE.update) SCENE.update(dt, t);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = SCENE.trail || 1;
  ctx.drawImage(bgSprite, 0, 0, W, H);
  ctx.globalAlpha = 1;
  SCENE.draw(t, ox, oy);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  octx.clearRect(0, 0, W, H);
  drawDust(dt);
  if (SCENE.drawOver) { octx.save(); SCENE.drawOver(t, ox, oy); octx.restore(); }
  drawOverlay(t, dt);
}
window.addEventListener('mousemove', e => { mx = (e.clientX / W) * 2 - 1; my = (e.clientY / H) * 2 - 1; });
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 200); });
setup();
requestAnimationFrame(loop);

</script>
</body>
</html>
