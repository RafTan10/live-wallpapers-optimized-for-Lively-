<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Night · Suspension Bridge</title>
<!--
  City Night · Suspension Bridge — live wallpaper for Lively Wallpaper (grey · mathematical series)
  Add it in Lively: click "+" → choose this file.
  Change the SETTINGS block below with Notepad, save, then re-add in Lively.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="base"></canvas>
<canvas id="over"></canvas>
<script>
// ===================== SETTINGS =====================
const SETTINGS = {
  theme: 'grey',    // 'grey' | 'warm' | 'green' | 'ice' | 'amber'
  math: true,       // equations, labels and readouts (false = clean version)
  parallax: true,   // gentle shift with the mouse
  fps: 30,          // frame cap; 30 keeps the GPU/CPU load low
};
// ====================================================

// Cityscape — a city skyline at night across a river, crossed by a suspension bridge. The main cable hangs
// in a parabola, traffic streams over the deck, and windows and lights shimmer in the water.
const SCENE = {
  focus: [0.62, 0.42],
  ambient: false,
  anchors: [[0.24, 0.08], [0.46, 0.05], [0.22, 0.18], [0.62, 0.1], [0.4, 0.14], [0.22, 0.28]],
  title: 'SUSPENSION BRIDGE · CITY AT NIGHT',
  sub: 'main cable: parabola under a uniform deck load',
  eqs: [
    { e: 'y = 4 h x² / L²', n: 'cable shape for a uniformly loaded deck' },
    { e: 'T_H = w L² / (8 h)', n: 'horizontal cable tension' },
    { e: 'T_max = T_H √(1 + (4h / L)²)', n: 'peak tension, at the towers' },
    { e: 'y = a cosh(x / a)', n: 'catenary — a cable carrying only its own weight' },
    { e: 'h / L ≈ 1 / 9', n: 'typical sag-to-span ratio' },
    { e: 'f = (1 / 2L) √(T / μ)', n: 'fundamental frequency of a taut cable' }
  ],
  init() {
    this.water = H * 0.7;
    this.deck = H * 0.63;
    this.tA = W * 0.4; this.tB = W * 0.86;
    this.towerTop = H * 0.3;
    this.stars = [];
    for (let i = 0; i < 160; i++) this.stars.push([Math.random(), Math.random() * 0.45, rand(0.06, 0.35)]);
    this.blds = [];
    for (const layer of [0, 1]) {
      let x = -10;
      while (x < W + 10) {
        const w = rand(0.025, 0.06) * W * (layer ? 1 : 0.8), h = (layer ? rand(0.1, 0.3) : rand(0.08, 0.2)) * H * (0.7 + 0.6 * Math.exp(-((x / W - 0.62) ** 2) / 0.05));
        this.blds.push({ x, w, h, layer, spire: Math.random() < 0.15, wins: Array.from({ length: 80 }, () => Math.random() < 0.35), seed: Math.random() * 100 });
        x += w + rand(2, 10) * scale;
      }
    }
    this.cars = [];
    for (let i = 0; i < 40; i++) this.cars.push({ u: Math.random(), dir: i % 2 ? 1 : -1, v: rand(0.03, 0.05) });
  },
  update(dt) { for (const c of this.cars) { c.u += c.dir * c.v * dt; if (c.u > 1.05) c.u = -0.05; if (c.u < -0.05) c.u = 1.05; } },
  draw(t, ox, oy) {
    const wl = this.water + oy * 0.5;
    ctx.globalCompositeOperation = 'lighter';
    for (const s of this.stars) { ctx.globalAlpha = s[2]; ctx.fillStyle = PAL[19]; ctx.fillRect(s[0] * W, s[1] * H, 1.3 * scale, 1.3 * scale); }
    const mx = W * 0.27, my = H * 0.17, mr = H * 0.04;
    ctx.globalAlpha = 0.8; ctx.fillStyle = shade(0.8, 0.3); ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
    // skyline: far layer then near layer, windows lit
    for (const layer of [0, 1]) {
      for (const b of this.blds) {
        if (b.layer !== layer) continue;
        const x = b.x + ox * (0.2 + layer * 0.3), top = wl - b.h - (layer ? 0 : H * 0.03);
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.fillStyle = DARK(layer ? 4 : 8);
        ctx.fillRect(x, top, b.w, wl - top);
        if (b.spire) { ctx.beginPath(); ctx.moveTo(x + b.w * 0.3, top); ctx.lineTo(x + b.w / 2, top - b.h * 0.25); ctx.lineTo(x + b.w * 0.7, top); ctx.fill(); }
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = layer ? 0.4 : 0.2; ctx.strokeStyle = PAL[layer ? 16 : 13]; ctx.lineWidth = 0.8 * scale;
        ctx.beginPath(); ctx.moveTo(x, wl); ctx.lineTo(x, top); ctx.lineTo(x + b.w, top); ctx.lineTo(x + b.w, wl); ctx.stroke();
        if (b.spire) { ctx.beginPath(); ctx.moveTo(x + b.w * 0.3, top); ctx.lineTo(x + b.w / 2, top - b.h * 0.25); ctx.lineTo(x + b.w * 0.7, top); ctx.stroke(); ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 1.2 + b.seed); ctx.fillStyle = PAL[22]; ctx.fillRect(x + b.w / 2 - scale, top - b.h * 0.25 - 3 * scale, 2 * scale, 2 * scale); }
        const cols = Math.max(2, Math.floor(b.w / (7 * scale))), rows = Math.min(16, Math.floor(b.h / (9 * scale)));
        ctx.fillStyle = PAL[layer ? 21 : 18];
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const idx = (r * cols + c + Math.floor(t / 7 + b.seed)) % 80;
          if (!b.wins[idx]) continue;
          ctx.globalAlpha = layer ? 0.55 : 0.3;
          const wx = x + (c + 0.5) * b.w / cols, wy = top + 6 * scale + r * 9 * scale;
          ctx.fillRect(wx - 1.2 * scale, wy, 2.4 * scale, 3 * scale);
          // reflection streak
          ctx.globalAlpha *= 0.35;
          ctx.fillRect(wx - 1.2 * scale + Math.sin(t * 1.5 + wy) * 2 * scale, wl + (wl - wy) * 0.9, 2.4 * scale, 4 * scale);
        }
      }
    }
    // water surface
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 0.5; ctx.fillStyle = DARK(2); ctx.fillRect(0, wl, W, H - wl);
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 30; k++) {
      const y = wl + Math.pow(k / 30, 1.3) * (H - wl);
      ctx.globalAlpha = 0.04 + 0.08 * k / 30; ctx.strokeStyle = PAL[15]; ctx.lineWidth = 0.7 * scale;
      ctx.beginPath(); for (let x = 0; x <= W; x += 14 * scale) { const yy = y + Math.sin(x * 0.01 / scale + t * 0.7 + k) * (0.5 + k * 0.06) * scale; x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); } ctx.stroke();
    }
    // bridge: towers, deck, main cable (parabola), side spans, suspenders
    const A = this.tA + ox, B = this.tB + ox, deck = this.deck + oy * 0.5, tt = this.towerTop + oy * 0.5, L = B - A, sag = H * 0.24;
    const cab = x => { const xm = x - (A + L / 2); return tt + H * 0.02 + sag * (1 - 4 * (xm * xm) / (L * L)); };
    for (const dir of [1, -1]) {
      const yRef = y => dir > 0 ? y : wl + (wl - y) * 0.85 + Math.sin(t + y * 0.05) * 2 * scale;
      const al = dir > 0 ? 1 : 0.18;
      ctx.lineWidth = 1 * scale;
      // towers
      for (const x of [A, B]) {
        ctx.globalAlpha = 0.7 * al; ctx.strokeStyle = PAL[20];
        ctx.beginPath();
        for (const dx of [-7, 7]) { ctx.moveTo(x + dx * scale, yRef(wl)); ctx.lineTo(x + dx * 0.7 * scale, yRef(tt)); }
        for (const yy of [tt + H * 0.02, deck - H * 0.06, deck + H * 0.02]) { ctx.moveTo(x - 7 * scale, yRef(yy)); ctx.lineTo(x + 7 * scale, yRef(yy)); }
        ctx.stroke();
        if (dir > 0) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 0.9 + x); ctx.fillStyle = PAL[23]; ctx.fillRect(x - 1.5 * scale, tt - 5 * scale, 3 * scale, 3 * scale); }
      }
      // deck
      ctx.globalAlpha = 0.65 * al; ctx.strokeStyle = PAL[19]; ctx.lineWidth = 1.4 * scale;
      ctx.beginPath(); ctx.moveTo(0, yRef(deck + H * 0.04)); ctx.quadraticCurveTo(W * 0.2, yRef(deck), A, yRef(deck)); ctx.lineTo(B, yRef(deck)); ctx.lineTo(W, yRef(deck + H * 0.01)); ctx.stroke();
      ctx.lineWidth = 0.8 * scale; ctx.globalAlpha = 0.35 * al;
      ctx.beginPath(); ctx.moveTo(0, yRef(deck + H * 0.048)); ctx.quadraticCurveTo(W * 0.2, yRef(deck + H * 0.008), A, yRef(deck + H * 0.008)); ctx.lineTo(W, yRef(deck + H * 0.018)); ctx.stroke();
      // main cable and side spans
      ctx.globalAlpha = 0.75 * al; ctx.strokeStyle = PAL[21]; ctx.lineWidth = 1.3 * scale;
      ctx.beginPath();
      for (let x = A; x <= B; x += 6 * scale) x === A ? ctx.moveTo(x, yRef(cab(x))) : ctx.lineTo(x, yRef(cab(x)));
      ctx.lineTo(B, yRef(cab(B)));
      ctx.moveTo(A, yRef(tt + H * 0.02)); ctx.quadraticCurveTo(A - W * 0.12, yRef(deck - H * 0.12), A - W * 0.25, yRef(deck));
      ctx.moveTo(B, yRef(tt + H * 0.02)); ctx.quadraticCurveTo(B + W * 0.07, yRef(deck - H * 0.1), W + 20 * scale, yRef(deck - H * 0.02));
      ctx.stroke();
      // suspenders
      ctx.globalAlpha = 0.28 * al; ctx.strokeStyle = PAL[18]; ctx.lineWidth = 0.7 * scale;
      ctx.beginPath();
      for (let x = A + 12 * scale; x < B; x += 12 * scale) { ctx.moveTo(x, yRef(cab(x))); ctx.lineTo(x, yRef(deck)); }
      ctx.stroke();
      // deck lamps
      ctx.fillStyle = PAL[22];
      for (let x = A + 24 * scale; x < B; x += 48 * scale) { ctx.globalAlpha = 0.7 * al; ctx.fillRect(x - 1.2 * scale, yRef(deck - 4 * scale), 2.4 * scale, 2.4 * scale); }
    }
    // traffic: headlights one way, tail lights the other
    for (const c of this.cars) {
      const x = lerp(-W * 0.05, W * 1.05, c.u) + ox, y = (x < A ? deck + (H * 0.04) * Math.pow(Math.max(0, (A - x) / A), 2) : deck) - (c.dir > 0 ? 2 : -3) * scale;
      ctx.globalAlpha = c.dir > 0 ? 0.9 : 0.5; ctx.strokeStyle = PAL[c.dir > 0 ? 23 : 17]; ctx.lineWidth = 1.6 * scale;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - c.dir * 10 * scale, y); ctx.stroke();
    }
    this.geo = { A, B, tt, deck, sag, L, cab };
  },
  drawOver(t) {
    if (!SETTINGS.math || !this.geo) return;
    const o = octx, { A, B, tt, sag, L, cab } = this.geo;
    o.lineWidth = 0.8 * scale; o.font = MONO(10.5); o.textBaseline = 'middle';
    // span and sag dimensions
    const y = tt - H * 0.05;
    o.globalAlpha = 0.45; o.strokeStyle = PAL[17];
    o.beginPath(); o.moveTo(A, y); o.lineTo(B, y); o.moveTo(A, y - 5 * scale); o.lineTo(A, y + 5 * scale); o.moveTo(B, y - 5 * scale); o.lineTo(B, y + 5 * scale); o.stroke();
    const mid = (A + B) / 2, y0 = tt + H * 0.02, y1 = cab(mid);
    o.setLineDash([2 * scale, 4 * scale]); o.beginPath(); o.moveTo(A, y0); o.lineTo(B, y0); o.stroke(); o.setLineDash([]);
    o.beginPath(); o.moveTo(mid, y0); o.lineTo(mid, y1); o.moveTo(mid - 5 * scale, y1); o.lineTo(mid + 5 * scale, y1); o.stroke();
    o.globalAlpha = 0.7; o.fillStyle = PAL[18]; o.textAlign = 'center';
    o.fillText('L = 1 000 m', mid, y - 12 * scale);
    o.textAlign = 'left'; o.fillText('h = 110 m', mid + 10 * scale, (y0 + y1) / 2);
    // tension calculation
    const x = W * 0.22, yy = H * 0.42;
    o.globalAlpha = 0.6; o.fillStyle = PAL[17];
    o.fillText('w = 200 kN/m (deck + traffic)', x, yy);
    o.globalAlpha = 0.5;
    const TH = 200e3 * 1000 * 1000 / (8 * 110), Tm = TH * Math.sqrt(1 + (4 * 110 / 1000) ** 2);
    o.fillText(`T_H = wL²/8h ≈ ${(TH / 1e6).toFixed(0)} MN`, x, yy + 16 * scale);
    o.fillText(`T_max ≈ ${(Tm / 1e6).toFixed(0)} MN at the towers`, x, yy + 32 * scale);
  },
  hud() { return [`${this.cars.length} vehicles · ${this.blds.length} buildings`]; }
};


// ===================== ENGINE (shared) =====================
const THEMES = {
  grey:  { hue: 220, sat: 7 },
  warm:  { hue: 30, sat: 45 },
  green: { hue: 140, sat: 85 },
  ice:   { hue: 190, sat: 90 },
  amber: { hue: 36,  sat: 95 }
};
const theme = THEMES[SETTINGS.theme] || THEMES.grey;

const LEVELS = 24, PAL = [], RGB = [];
function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
for (let i = 0; i < LEVELS; i++) {
  const t = i / (LEVELS - 1);
  const s = Math.round(theme.sat * (1 - t * 0.78)), l = Math.round(18 + t * 72);
  PAL.push(`hsl(${theme.hue},${s}%,${l}%)`);
  RGB.push(hsl2rgb(theme.hue, s, l));
}
const shade = (t, a = 1) => {
  const i = Math.max(0, Math.min(LEVELS - 1, Math.round(t * (LEVELS - 1))));
  const c = RGB[i];
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
};

const base = document.getElementById('base'), over = document.getElementById('over');
const ctx = base.getContext('2d'), octx = over.getContext('2d');
let W, H, DPR, scale, bgSprite;
let mx = 0, my = 0, smx = 0, smy = 0;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const GLYPHS = Array.from('01∂∫∇∑∏πλθφψΩμνσ∞≈≡≠≤≥√Δ±×∈∀∃ℏ{}<>=+-*/^|()[]');
const pick = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];
// colour ramps for the realistic scenes: stops = [[t, [r,g,b]], ...]
const ramp = (stops, t) => {
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [t0, c0] = stops[i - 1], [t1, c1] = stops[i], f = (t - t0) / (t1 - t0 || 1);
    return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];
  }
  return stops[stops.length - 1][1];
};
const mixc = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const toGrey = c => { const l = 0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]; return [l * 0.97, l, l * 1.04]; };
const DARK = l => `hsl(${theme.hue},${Math.min(theme.sat, 10)}%,${l}%)`;   // near-black silhouette fill
// deterministic pseudo-random from an integer (stable shapes every frame)
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const MONO = s => `${(s * scale).toFixed(1)}px Consolas, "Cambria Math", "Segoe UI Symbol", "Courier New", monospace`;
const MATHF = s => `italic ${(s * scale).toFixed(1)}px "Cambria Math", "Times New Roman", serif`;

// Improved Perlin noise (3D)
const PERM = new Uint8Array(512);
(() => {
  const p = []; for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function noise3(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const fd = t => t * t * t * (t * (t * 6 - 15) + 10);
  const u = fd(x), v = fd(y), w = fd(z);
  const grad = (h, x, y, z) => {
    h &= 15; const a = h < 8 ? x : y, b = h < 4 ? y : (h === 12 || h === 14) ? x : z;
    return ((h & 1) ? -a : a) + ((h & 2) ? -b : b);
  };
  const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A + 1] + Z;
  const B = PERM[X + 1] + Y, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;
  return lerp(
    lerp(lerp(grad(PERM[AA], x, y, z), grad(PERM[BA], x - 1, y, z), u),
         lerp(grad(PERM[AB], x, y - 1, z), grad(PERM[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(PERM[AA + 1], x, y, z - 1), grad(PERM[BA + 1], x - 1, y, z - 1), u),
         lerp(grad(PERM[AB + 1], x, y - 1, z - 1), grad(PERM[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}

// Background: dark vertical gradient + soft glow at the scene's focus + vignette
function makeBg() {
  const c = document.createElement('canvas');
  c.width = base.width; c.height = base.height;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const s = Math.min(theme.sat, 12), h = theme.hue;
  const lin = g.createLinearGradient(0, 0, 0, H);
  lin.addColorStop(0, `hsl(${h},${s}%,7%)`);
  lin.addColorStop(1, `hsl(${h},${s}%,2.5%)`);
  g.fillStyle = lin; g.fillRect(0, 0, W, H);
  const fx = SCENE.focus[0] * W, fy = SCENE.focus[1] * H;
  const rad = g.createRadialGradient(fx, fy, 0, fx, fy, Math.max(W, H) * 0.65);
  rad.addColorStop(0, `hsla(${h},${s}%,30%,${SCENE.glow ?? 0.28})`);
  rad.addColorStop(0.35, `hsla(${h},${s}%,16%,0.16)`);
  rad.addColorStop(1, `hsla(${h},${s}%,0%,0)`);
  g.fillStyle = rad; g.fillRect(0, 0, W, H);
  const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
  if (SCENE.ambient !== false) {
    // faint graph-paper dots, with a small cross every fourth point
    const sp = 46 * scale;
    g.fillStyle = PAL[14]; g.strokeStyle = PAL[14]; g.lineWidth = 0.8 * scale;
    for (let i = 0, x = sp / 2; x < W; x += sp, i++) {
      for (let j = 0, y = sp / 2; y < H; y += sp, j++) {
        if (i % 4 === 0 && j % 4 === 0) {
          g.globalAlpha = 0.13;
          g.beginPath(); g.moveTo(x - 3 * scale, y); g.lineTo(x + 3 * scale, y); g.moveTo(x, y - 3 * scale); g.lineTo(x, y + 3 * scale); g.stroke();
        } else { g.globalAlpha = 0.08; g.fillRect(x - 0.6 * scale, y - 0.6 * scale, 1.2 * scale, 1.2 * scale); }
      }
    }
    // rulers along the top and bottom edges
    g.globalAlpha = 0.16;
    g.beginPath();
    for (let k = 0, x = 0; x < W; x += 10 * scale, k++) {
      const L = (k % 10 === 0 ? 9 : k % 5 === 0 ? 5 : 2.5) * scale;
      g.moveTo(x, 0); g.lineTo(x, L); g.moveTo(x, H); g.lineTo(x, H - L);
    }
    g.stroke();
    // corner crop marks
    g.globalAlpha = 0.25;
    const m = 18 * scale, q = 14 * scale;
    g.beginPath();
    for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
      g.moveTo(x, y + sy * q); g.lineTo(x, y); g.lineTo(x + sx * q, y);
    }
    g.stroke();
    g.globalAlpha = 1;
  }
  return c;
}

// drifting faint characters, like dust in the light
const dust = [];
function drawDust(dt) {
  if (SCENE.dust === false) return;
  if (!dust.length) for (let i = 0; i < 30; i++) dust.push({ x: Math.random(), y: Math.random(), vx: rand(-0.004, 0.004), vy: rand(-0.006, -0.0015), g: pick(), a: rand(0.07, 0.18), s: rand(9, 12) });
  const o = octx;
  o.save(); o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = PAL[16];
  for (const d of dust) {
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); d.g = pick(); }
    if (d.x < -0.02) d.x = 1.02; if (d.x > 1.02) d.x = -0.02;
    o.globalAlpha = d.a; o.font = MONO(d.s);
    o.fillText(d.g, d.x * W, d.y * H);
  }
  o.restore();
}

// ---------- Overlay: equations typed out + top-right readout ----------
const EQ_ANCHORS = SCENE.anchors || [[0.30, 0.12], [0.58, 0.08], [0.26, 0.87], [0.60, 0.93], [0.34, 0.32], [0.74, 0.80]];
const eqSlots = [{ eq: -1, anchor: -1, age: 0, dur: 0 }, { eq: -1, anchor: -1, age: -5, dur: 0 }];
let eqNext = (Math.random() * SCENE.eqs.length) | 0;
function eqAssign(s) {
  s.eq = eqNext; eqNext = (eqNext + 1) % SCENE.eqs.length;
  const used = eqSlots.map(o => o.anchor);
  let a; do { a = (Math.random() * EQ_ANCHORS.length) | 0; } while (used.includes(a));
  s.anchor = a;
  s.dur = SCENE.eqs[s.eq].e.length / 20 + 8;
}
function drawOverlay(t, dt) {
  if (!SETTINGS.math) return;
  const o = octx;
  o.save();
  o.textBaseline = 'middle';
  for (const s of eqSlots) {
    if (s.eq < 0) eqAssign(s);
    s.age += dt;
    if (s.age < 0) continue;
    if (s.age > s.dur) { eqAssign(s); s.age = -2; continue; }
    const q = SCENE.eqs[s.eq], n = Math.min(q.e.length, Math.floor(s.age * 20));
    const fade = clamp((s.dur - s.age) / 1.5, 0, 1) * clamp(s.age * 2, 0, 1);
    const x = EQ_ANCHORS[s.anchor][0] * W, y = EQ_ANCHORS[s.anchor][1] * H;
    o.textAlign = 'left';
    o.font = MATHF(15.5);
    o.globalAlpha = 0.8 * fade; o.fillStyle = PAL[20];
    const shown = q.e.slice(0, n);
    o.fillText(shown, x, y);
    if (n < q.e.length) {
      const w = o.measureText(shown).width;
      o.fillRect(x + w + 3 * scale, y - 8 * scale, 1.4 * scale, 16 * scale);
    } else {
      o.font = MONO(10.5); o.fillStyle = PAL[13];
      o.globalAlpha = 0.6 * fade * clamp((s.age - q.e.length / 20) * 1.5, 0, 1);
      o.fillText('— ' + q.n, x, y + 20 * scale);
    }
  }
  o.font = MONO(10.5); o.textAlign = 'right'; o.textBaseline = 'top';
  const hx = W - 28 * scale; let hy = 26 * scale;
  const lines = [[SCENE.title, 0.62, 13], [SCENE.sub, 0.48, 13], ...(SCENE.hud ? SCENE.hud(t).map(l => [l, 0.48, 13]) : []),
                 [`t = ${t.toFixed(2).padStart(9, '0')} s`, 0.75, 20]];
  for (const [txt, al, c] of lines) { o.globalAlpha = al; o.fillStyle = PAL[c]; o.fillText(txt, hx, hy); hy += 16 * scale; }
  o.restore();
}

// ---------- Boot ----------
function setup() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [base, over]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scale = Math.max(0.6, Math.min(W, H) / 1080);
  bgSprite = makeBg();
  ctx.drawImage(bgSprite, 0, 0, W, H);
  SCENE.init();
}

let last = performance.now(), acc = 0, T0 = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  acc += now - last; last = now;
  if (acc < 1000 / SETTINGS.fps - 1) return;
  const dt = Math.min(acc / 1000, 0.1);
  acc = 0;
  const t = (now - T0) / 1000;
  smx += (mx - smx) * 0.05; smy += (my - smy) * 0.05;
  const off = SETTINGS.parallax ? 12 * scale : 0;
  const ox = smx * off, oy = smy * off;
  if (SCENE.update) SCENE.update(dt, t);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = SCENE.trail || 1;
  ctx.drawImage(bgSprite, 0, 0, W, H);
  ctx.globalAlpha = 1;
  SCENE.draw(t, ox, oy);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  octx.clearRect(0, 0, W, H);
  drawDust(dt);
  if (SCENE.drawOver) { octx.save(); SCENE.drawOver(t, ox, oy); octx.restore(); }
  drawOverlay(t, dt);
}
window.addEventListener('mousemove', e => { mx = (e.clientX / W) * 2 - 1; my = (e.clientY / H) * 2 - 1; });
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 200); });
setup();
requestAnimationFrame(loop);

</script>
</body>
