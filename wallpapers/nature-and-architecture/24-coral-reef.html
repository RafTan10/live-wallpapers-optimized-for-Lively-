<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coral Reef · Fish School</title>
<!--
  Coral Reef · Fish School — live wallpaper for Lively Wallpaper (grey · mathematical series)
  Add it in Lively: click "+" → choose this file.
  Change the SETTINGS block below with Notepad, save, then re-add in Lively.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="base"></canvas>
<canvas id="over"></canvas>
<script>
// ===================== SETTINGS =====================
const SETTINGS = {
  theme: 'grey',    // 'grey' | 'warm' | 'green' | 'ice' | 'amber'
  math: true,       // equations, labels and readouts (false = clean version)
  parallax: true,   // gentle shift with the mouse
  fps: 30,          // frame cap; 30 keeps the GPU/CPU load low
};
// ====================================================

// Nature — under the sea. Sunlight falls in shafts through the surface, a school of fish moves by the
// three boids rules, kelp sways, bubbles rise and swell as the pressure drops, corals branch on the floor.
const SCENE = {
  focus: [0.55, 0.0],
  glow: 0.32,
  anchors: [[0.24, 0.12], [0.46, 0.08], [0.22, 0.3], [0.62, 0.22], [0.24, 0.46], [0.5, 0.36]],
  title: 'CORAL REEF · COLLECTIVE MOTION',
  sub: 'boids: separation · alignment · cohesion',
  eqs: [
    { e: 'v ← v + w_s s + w_a a + w_c c', n: "Reynolds' boids: three local rules make a school" },
    { e: 'n₁ sin θ₁ = n₂ sin θ₂', n: "Snell's law — light bends entering the water" },
    { e: 'I(z) = I₀ e^(−k z)', n: 'light fades with depth' },
    { e: 'P = P₀ + ρ g h', n: 'pressure grows 1 atm every ≈ 10 m' },
    { e: 'P V = const', n: "Boyle's law — rising bubbles grow" },
    { e: 'n_water ≈ 1.33', n: 'refractive index of water' }
  ],
  init() {
    this.fish = [];
    for (let i = 0; i < 70; i++) this.fish.push({ x: rand(0.3, 0.8) * W, y: rand(0.3, 0.6) * H, vx: rand(-1, 1) * 40 * scale, vy: rand(-1, 1) * 20 * scale });
    this.kelp = [];
    for (let i = 0; i < 16; i++) this.kelp.push({ x: rand(0.22, 0.98), h: rand(0.25, 0.5), ph: rand(0, TAU), seg: 14 });
    this.bubbles = [];
    for (let i = 0; i < 36; i++) this.bubbles.push(this.newBubble(true));
    this.corals = [];
    for (let i = 0; i < 9; i++) this.corals.push({ x: rand(0.24, 0.98), s: rand(0.6, 1.2), seed: i * 31 + 7 });
    this.floor = H * 0.9;
  },
  newBubble(any) { return { x: rand(0.25, 0.98), y: any ? rand(0.2, 0.9) : 0.9, r: rand(1.2, 3), ph: rand(0, TAU) }; },
  update(dt, t) {
    const F = this.fish, R = 46 * scale, Rs = 16 * scale, vmax = 70 * scale;
    for (const f of F) {
      let ax = 0, ay = 0, cx = 0, cy = 0, sx = 0, sy = 0, n = 0;
      for (const g of F) {
        if (g === f) continue;
        const dx = g.x - f.x, dy = g.y - f.y, d = Math.hypot(dx, dy);
        if (d < R) { ax += g.vx; ay += g.vy; cx += g.x; cy += g.y; n++; if (d < Rs) { sx -= dx / (d + 1e-3); sy -= dy / (d + 1e-3); } }
      }
      if (n) { f.vx += ((ax / n - f.vx) * 0.6 + (cx / n - f.x) * 0.5) * dt; f.vy += ((ay / n - f.vy) * 0.6 + (cy / n - f.y) * 0.5) * dt; }
      f.vx += sx * 60 * scale * dt; f.vy += sy * 60 * scale * dt;
      // a slow wandering target keeps the school moving around the screen
      const tx = W * (0.6 + 0.3 * Math.sin(t * 0.07)), ty = H * (0.45 + 0.15 * Math.sin(t * 0.11));
      f.vx += (tx - f.x) * 0.04 * dt; f.vy += (ty - f.y) * 0.05 * dt;
      const v = Math.hypot(f.vx, f.vy); if (v > vmax) { f.vx *= vmax / v; f.vy *= vmax / v; }
      f.x += f.vx * dt; f.y += f.vy * dt;
    }
    for (const b of this.bubbles) { const depthK = 1 + (b.y - 0.2); b.y -= 0.035 * dt / depthK; b.x += Math.sin(t * 2 + b.ph) * 0.0006; if (b.y < 0.05) Object.assign(b, this.newBubble(false)); }
  },
  coral(x, y, ang, len, d, seed, out) {
    const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
    out.push([x, y, x2, y2, d]);
    if (d <= 1) return;
    const h = hash(seed);
    this.coral(x2, y2, ang - 0.35 - h * 0.3, len * 0.75, d - 1, seed * 2 + 1, out);
    this.coral(x2, y2, ang + 0.35 + h * 0.3, len * 0.75, d - 1, seed * 2 + 2, out);
    if (h > 0.6) this.coral(x2, y2, ang, len * 0.7, d - 2, seed * 3 + 5, out);
  },
  draw(t, ox, oy) {
    ctx.globalCompositeOperation = 'lighter';
    // surface with refraction ripples
    ctx.lineWidth = 0.8 * scale;
    for (let k = 0; k < 4; k++) {
      ctx.globalAlpha = 0.25 - k * 0.05; ctx.strokeStyle = PAL[19];
      ctx.beginPath();
      for (let x = 0; x <= W; x += 10 * scale) { const y = H * 0.05 + k * 6 * scale + Math.sin(x * 0.012 / scale + t * 0.9 + k) * 3 * scale + Math.sin(x * 0.031 / scale - t * 1.3) * 1.5 * scale; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    }
    // god rays: wedges from the surface, swaying with the waves
    for (let k = 0; k < 9; k++) {
      const x0 = W * (0.2 + k * 0.1) + Math.sin(t * 0.25 + k * 1.7) * W * 0.02, w0 = W * 0.018 * (1 + hash(k)), spread = W * 0.06;
      const g = ctx.createLinearGradient(0, H * 0.05, 0, H * 0.9);
      g.addColorStop(0, shade(0.9, 0.14)); g.addColorStop(1, shade(0.6, 0));
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 0.4 + k); ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(x0 - w0, H * 0.05); ctx.lineTo(x0 + w0, H * 0.05); ctx.lineTo(x0 + w0 + spread * 0.6 + W * 0.08, H * 0.9); ctx.lineTo(x0 - w0 + W * 0.08 - spread * 0.2, H * 0.9); ctx.closePath(); ctx.fill();
    }
    // caustic net on the sand
    ctx.lineWidth = 0.7 * scale; ctx.strokeStyle = PAL[18];
    for (let k = 0; k < 6; k++) {
      ctx.globalAlpha = 0.12;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 8 * scale) {
        const y = this.floor + k * 7 * scale + Math.sin(x * 0.02 / scale + t * 0.7 + k * 1.3) * 4 * scale + Math.sin(x * 0.047 / scale - t * 0.5 + k) * 2.5 * scale;
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 0.4; ctx.strokeStyle = PAL[16]; ctx.lineWidth = 1 * scale;
    ctx.beginPath(); for (let x = 0; x <= W; x += 10 * scale) { const y = this.floor + noise3(x * 0.004, 2, 1) * 10 * scale; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
    // corals
    for (const c of this.corals) {
      const segs = []; this.coral(c.x * W + ox * 0.6, this.floor, -Math.PI / 2, H * 0.05 * c.s, 6, c.seed, segs);
      ctx.strokeStyle = PAL[17];
      for (let d = 6; d >= 1; d--) {
        ctx.globalAlpha = 0.25 + 0.05 * d; ctx.lineWidth = (0.6 + d * 0.35) * scale;
        ctx.beginPath(); for (const sg of segs) if (sg[4] === d) { ctx.moveTo(sg[0], sg[1]); ctx.lineTo(sg[2], sg[3]); } ctx.stroke();
      }
    }
    // kelp
    for (const k of this.kelp) {
      let x = k.x * W + ox * 0.5, y = this.floor;
      const L = k.h * H / k.seg;
      ctx.beginPath(); ctx.moveTo(x, y);
      const pts = [];
      for (let i = 1; i <= k.seg; i++) {
        const a = -Math.PI / 2 + Math.sin(t * 0.5 + k.ph + i * 0.35) * 0.18 * (i / k.seg) + 0.08;
        x += Math.cos(a) * L; y += Math.sin(a) * L; ctx.lineTo(x, y); pts.push([x, y, a]);
      }
      ctx.globalAlpha = 0.4; ctx.strokeStyle = PAL[16]; ctx.lineWidth = 1.6 * scale; ctx.stroke();
      ctx.lineWidth = 0.8 * scale; ctx.beginPath();
      pts.forEach(([px, py, a], i) => { if (i % 2) return; const s = i % 4 ? 1 : -1, l = 10 * scale; ctx.moveTo(px, py); ctx.quadraticCurveTo(px + s * l * 0.6, py - l * 0.2, px + s * l, py + l * 0.3); });
      ctx.globalAlpha = 0.3; ctx.stroke();
    }
    // fish
    for (const f of this.fish) {
      const a = Math.atan2(f.vy, f.vx), s = 7 * scale, wig = Math.sin(t * 9 + f.x * 0.05) * 0.25;
      ctx.save(); ctx.translate(f.x + ox * 0.8, f.y + oy * 0.8); ctx.rotate(a);
      ctx.globalAlpha = 0.75; ctx.strokeStyle = PAL[21]; ctx.lineWidth = 1 * scale;
      ctx.beginPath(); ctx.moveTo(s, 0); ctx.quadraticCurveTo(0, -s * 0.45, -s * 0.8, 0); ctx.quadraticCurveTo(0, s * 0.45, s, 0);
      ctx.moveTo(-s * 0.8, 0); ctx.lineTo(-s * 1.3, -s * 0.4 + wig * s); ctx.lineTo(-s * 1.3, s * 0.4 + wig * s); ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
    // bubbles (grow as they rise: V ∝ 1/P)
    ctx.strokeStyle = PAL[20]; ctx.lineWidth = 0.8 * scale;
    for (const b of this.bubbles) {
      const P = 1 + (b.y - 0.05) * 3, r = b.r * Math.cbrt(4 / P) * scale;
      ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(b.x * W, b.y * H, r, 0, TAU); ctx.stroke();
    }
  },
  drawOver(t) {
    if (!SETTINGS.math) return;
    const o = octx;
    // depth gauge with pressure on the right
    const x = W * 0.965, y0 = H * 0.08, y1 = this.floor;
    o.lineWidth = 0.8 * scale; o.globalAlpha = 0.4; o.strokeStyle = PAL[15];
    o.beginPath(); o.moveTo(x, y0); o.lineTo(x, y1); o.stroke();
    o.font = MONO(10); o.textBaseline = 'middle'; o.textAlign = 'right'; o.fillStyle = PAL[16];
    for (let k = 0; k <= 5; k++) {
      const y = lerp(y0, y1, k / 5), d = k * 6;
      o.beginPath(); o.moveTo(x - 5 * scale, y); o.lineTo(x, y); o.stroke();
      o.fillText(`${d} m  ${(1 + d / 10.06).toFixed(2)} atm  ${(100 * Math.exp(-0.12 * d)).toFixed(0)}% light`, x - 9 * scale, y);
    }
    // the school's centre and heading
    let cx = 0, cy = 0, vx = 0, vy = 0; for (const f of this.fish) { cx += f.x; cy += f.y; vx += f.vx; vy += f.vy; }
    const n = this.fish.length; cx /= n; cy /= n; vx /= n; vy /= n;
    let pol = 0; for (const f of this.fish) pol += f.vx * vx + f.vy * vy > 0 ? (f.vx * vx + f.vy * vy) / (Math.hypot(f.vx, f.vy) * Math.hypot(vx, vy) + 1e-6) : 0;
    o.globalAlpha = 0.55; o.strokeStyle = PAL[20]; o.setLineDash([2 * scale, 4 * scale]);
    o.beginPath(); o.arc(cx, cy, 6 * scale, 0, TAU); o.moveTo(cx, cy); o.lineTo(cx + vx * 1.2, cy + vy * 1.2); o.stroke(); o.setLineDash([]);
    o.textAlign = 'left'; o.fillStyle = PAL[18]; o.globalAlpha = 0.65;
    o.fillText(`school centre · polarisation φ = ${(pol / n).toFixed(2)}`, cx + 12 * scale, cy - 12 * scale);
  },
  hud() { return [`${this.fish.length} fish · neighbourhood radius 46 px`]; }
};


// ===================== ENGINE (shared) =====================
const THEMES = {
  grey:  { hue: 220, sat: 7 },
  warm:  { hue: 30, sat: 45 },
  green: { hue: 140, sat: 85 },
  ice:   { hue: 190, sat: 90 },
  amber: { hue: 36,  sat: 95 }
};
const theme = THEMES[SETTINGS.theme] || THEMES.grey;

const LEVELS = 24, PAL = [], RGB = [];
function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
for (let i = 0; i < LEVELS; i++) {
  const t = i / (LEVELS - 1);
  const s = Math.round(theme.sat * (1 - t * 0.78)), l = Math.round(18 + t * 72);
  PAL.push(`hsl(${theme.hue},${s}%,${l}%)`);
  RGB.push(hsl2rgb(theme.hue, s, l));
}
const shade = (t, a = 1) => {
  const i = Math.max(0, Math.min(LEVELS - 1, Math.round(t * (LEVELS - 1))));
  const c = RGB[i];
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
};

const base = document.getElementById('base'), over = document.getElementById('over');
const ctx = base.getContext('2d'), octx = over.getContext('2d');
let W, H, DPR, scale, bgSprite;
let mx = 0, my = 0, smx = 0, smy = 0;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const GLYPHS = Array.from('01∂∫∇∑∏πλθφψΩμνσ∞≈≡≠≤≥√Δ±×∈∀∃ℏ{}<>=+-*/^|()[]');
const pick = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];
// colour ramps for the realistic scenes: stops = [[t, [r,g,b]], ...]
const ramp = (stops, t) => {
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [t0, c0] = stops[i - 1], [t1, c1] = stops[i], f = (t - t0) / (t1 - t0 || 1);
    return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];
  }
  return stops[stops.length - 1][1];
};
const mixc = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const toGrey = c => { const l = 0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]; return [l * 0.97, l, l * 1.04]; };
const DARK = l => `hsl(${theme.hue},${Math.min(theme.sat, 10)}%,${l}%)`;   // near-black silhouette fill
// deterministic pseudo-random from an integer (stable shapes every frame)
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const MONO = s => `${(s * scale).toFixed(1)}px Consolas, "Cambria Math", "Segoe UI Symbol", "Courier New", monospace`;
const MATHF = s => `italic ${(s * scale).toFixed(1)}px "Cambria Math", "Times New Roman", serif`;

// Improved Perlin noise (3D)
const PERM = new Uint8Array(512);
(() => {
  const p = []; for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function noise3(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const fd = t => t * t * t * (t * (t * 6 - 15) + 10);
  const u = fd(x), v = fd(y), w = fd(z);
  const grad = (h, x, y, z) => {
    h &= 15; const a = h < 8 ? x : y, b = h < 4 ? y : (h === 12 || h === 14) ? x : z;
    return ((h & 1) ? -a : a) + ((h & 2) ? -b : b);
  };
  const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A + 1] + Z;
  const B = PERM[X + 1] + Y, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;
  return lerp(
    lerp(lerp(grad(PERM[AA], x, y, z), grad(PERM[BA], x - 1, y, z), u),
         lerp(grad(PERM[AB], x, y - 1, z), grad(PERM[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(PERM[AA + 1], x, y, z - 1), grad(PERM[BA + 1], x - 1, y, z - 1), u),
         lerp(grad(PERM[AB + 1], x, y - 1, z - 1), grad(PERM[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}

// Background: dark vertical gradient + soft glow at the scene's focus + vignette
function makeBg() {
  const c = document.createElement('canvas');
  c.width = base.width; c.height = base.height;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const s = Math.min(theme.sat, 12), h = theme.hue;
  const lin = g.createLinearGradient(0, 0, 0, H);
  lin.addColorStop(0, `hsl(${h},${s}%,7%)`);
  lin.addColorStop(1, `hsl(${h},${s}%,2.5%)`);
  g.fillStyle = lin; g.fillRect(0, 0, W, H);
  const fx = SCENE.focus[0] * W, fy = SCENE.focus[1] * H;
  const rad = g.createRadialGradient(fx, fy, 0, fx, fy, Math.max(W, H) * 0.65);
  rad.addColorStop(0, `hsla(${h},${s}%,30%,${SCENE.glow ?? 0.28})`);
  rad.addColorStop(0.35, `hsla(${h},${s}%,16%,0.16)`);
  rad.addColorStop(1, `hsla(${h},${s}%,0%,0)`);
  g.fillStyle = rad; g.fillRect(0, 0, W, H);
  const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
  if (SCENE.ambient !== false) {
    // faint graph-paper dots, with a small cross every fourth point
    const sp = 46 * scale;
    g.fillStyle = PAL[14]; g.strokeStyle = PAL[14]; g.lineWidth = 0.8 * scale;
    for (let i = 0, x = sp / 2; x < W; x += sp, i++) {
      for (let j = 0, y = sp / 2; y < H; y += sp, j++) {
        if (i % 4 === 0 && j % 4 === 0) {
          g.globalAlpha = 0.13;
          g.beginPath(); g.moveTo(x - 3 * scale, y); g.lineTo(x + 3 * scale, y); g.moveTo(x, y - 3 * scale); g.lineTo(x, y + 3 * scale); g.stroke();
        } else { g.globalAlpha = 0.08; g.fillRect(x - 0.6 * scale, y - 0.6 * scale, 1.2 * scale, 1.2 * scale); }
      }
    }
    // rulers along the top and bottom edges
    g.globalAlpha = 0.16;
    g.beginPath();
    for (let k = 0, x = 0; x < W; x += 10 * scale, k++) {
      const L = (k % 10 === 0 ? 9 : k % 5 === 0 ? 5 : 2.5) * scale;
      g.moveTo(x, 0); g.lineTo(x, L); g.moveTo(x, H); g.lineTo(x, H - L);
    }
    g.stroke();
    // corner crop marks
    g.globalAlpha = 0.25;
    const m = 18 * scale, q = 14 * scale;
    g.beginPath();
    for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
      g.moveTo(x, y + sy * q); g.lineTo(x, y); g.lineTo(x + sx * q, y);
    }
    g.stroke();
    g.globalAlpha = 1;
  }
  return c;
}

// drifting faint characters, like dust in the light
const dust = [];
function drawDust(dt) {
  if (SCENE.dust === false) return;
  if (!dust.length) for (let i = 0; i < 30; i++) dust.push({ x: Math.random(), y: Math.random(), vx: rand(-0.004, 0.004), vy: rand(-0.006, -0.0015), g: pick(), a: rand(0.07, 0.18), s: rand(9, 12) });
  const o = octx;
  o.save(); o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = PAL[16];
  for (const d of dust) {
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); d.g = pick(); }
    if (d.x < -0.02) d.x = 1.02; if (d.x > 1.02) d.x = -0.02;
    o.globalAlpha = d.a; o.font = MONO(d.s);
    o.fillText(d.g, d.x * W, d.y * H);
  }
  o.restore();
}

// ---------- Overlay: equations typed out + top-right readout ----------
const EQ_ANCHORS = SCENE.anchors || [[0.30, 0.12], [0.58, 0.08], [0.26, 0.87], [0.60, 0.93], [0.34, 0.32], [0.74, 0.80]];
const eqSlots = [{ eq: -1, anchor: -1, age: 0, dur: 0 }, { eq: -1, anchor: -1, age: -5, dur: 0 }];
let eqNext = (Math.random() * SCENE.eqs.length) | 0;
function eqAssign(s) {
  s.eq = eqNext; eqNext = (eqNext + 1) % SCENE.eqs.length;
  const used = eqSlots.map(o => o.anchor);
  let a; do { a = (Math.random() * EQ_ANCHORS.length) | 0; } while (used.includes(a));
  s.anchor = a;
  s.dur = SCENE.eqs[s.eq].e.length / 20 + 8;
}
function drawOverlay(t, dt) {
  if (!SETTINGS.math) return;
  const o = octx;
  o.save();
  o.textBaseline = 'middle';
  for (const s of eqSlots) {
    if (s.eq < 0) eqAssign(s);
    s.age += dt;
    if (s.age < 0) continue;
    if (s.age > s.dur) { eqAssign(s); s.age = -2; continue; }
    const q = SCENE.eqs[s.eq], n = Math.min(q.e.length, Math.floor(s.age * 20));
    const fade = clamp((s.dur - s.age) / 1.5, 0, 1) * clamp(s.age * 2, 0, 1);
    const x = EQ_ANCHORS[s.anchor][0] * W, y = EQ_ANCHORS[s.anchor][1] * H;
    o.textAlign = 'left';
    o.font = MATHF(15.5);
    o.globalAlpha = 0.8 * fade; o.fillStyle = PAL[20];
    const shown = q.e.slice(0, n);
    o.fillText(shown, x, y);
    if (n < q.e.length) {
      const w = o.measureText(shown).width;
      o.fillRect(x + w + 3 * scale, y - 8 * scale, 1.4 * scale, 16 * scale);
    } else {
      o.font = MONO(10.5); o.fillStyle = PAL[13];
      o.globalAlpha = 0.6 * fade * clamp((s.age - q.e.length / 20) * 1.5, 0, 1);
      o.fillText('— ' + q.n, x, y + 20 * scale);
    }
  }
  o.font = MONO(10.5); o.textAlign = 'right'; o.textBaseline = 'top';
  const hx = W - 28 * scale; let hy = 26 * scale;
  const lines = [[SCENE.title, 0.62, 13], [SCENE.sub, 0.48, 13], ...(SCENE.hud ? SCENE.hud(t).map(l => [l, 0.48, 13]) : []),
                 [`t = ${t.toFixed(2).padStart(9, '0')} s`, 0.75, 20]];
  for (const [txt, al, c] of lines) { o.globalAlpha = al; o.fillStyle = PAL[c]; o.fillText(txt, hx, hy); hy += 16 * scale; }
  o.restore();
}

// ---------- Boot ----------
function setup() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [base, over]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scale = Math.max(0.6, Math.min(W, H) / 1080);
  bgSprite = makeBg();
  ctx.drawImage(bgSprite, 0, 0, W, H);
  SCENE.init();
}

let last = performance.now(), acc = 0, T0 = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  acc += now - last; last = now;
  if (acc < 1000 / SETTINGS.fps - 1) return;
  const dt = Math.min(acc / 1000, 0.1);
  acc = 0;
  const t = (now - T0) / 1000;
  smx += (mx - smx) * 0.05; smy += (my - smy) * 0.05;
  const off = SETTINGS.parallax ? 12 * scale : 0;
  const ox = smx * off, oy = smy * off;
  if (SCENE.update) SCENE.update(dt, t);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = SCENE.trail || 1;
  ctx.drawImage(bgSprite, 0, 0, W, H);
  ctx.globalAlpha = 1;
  SCENE.draw(t, ox, oy);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  octx.clearRect(0, 0, W, H);
  drawDust(dt);
  if (SCENE.drawOver) { octx.save(); SCENE.drawOver(t, ox, oy); octx.restore(); }
  drawOverlay(t, dt);
}
window.addEventListener('mousemove', e => { mx = (e.clientX / W) * 2 - 1; my = (e.clientY / H) * 2 - 1; });
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 200); });
setup();
requestAnimationFrame(loop);

</script>
</body>
</html>
