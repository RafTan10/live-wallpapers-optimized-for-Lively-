<script>
// ===================== SETTINGS =====================
const SETTINGS = {
  theme: 'warm',    // 'grey' | 'warm' | 'green' | 'ice' | 'amber'
  math: false,       // equations, labels and readouts (false = clean version)
  parallax: true,   // gentle shift with the mouse
  fps: 30,          // frame cap; 30 keeps the GPU/CPU load low
  palette: 'warm',  // 'warm' sand colours or 'grey'
  speed: 1.0,       // how fast the camera drifts
};
// ====================================================

// Realistic — a moonlit desert. Cold light from a high moon falls across a slowly drifting dune field
// under a dense band of stars; a small camp glows in a hollow and the occasional meteor crosses the sky.
const SCENE = {
  focus: [0.3, 0.2],
  glow: 0,
  ambient: false,
  dust: false,
  anchors: [[0.5, 0.06], [0.62, 0.12], [0.5, 0.2], [0.66, 0.26], [0.42, 0.3], [0.7, 0.06]],
  title: 'DESERT · MOONLIGHT',
  sub: 'moon elevation ≈ 32° · no light pollution',
  eqs: [
    { e: 'm = −2.5 log₁₀(F / F₀)', n: 'star brightness on the magnitude scale' },
    { e: 'E_moon ≈ 0.25 lx', n: 'full-moon illuminance — about 1/400 000 of sunlight' },
    { e: 'T_night ≈ T_day − 30 K', n: 'dry air loses heat fast after sunset' },
    { e: 'v_meteor ≈ 11–72 km/s', n: 'entry speed of a meteor' }
  ],
  init() {
    const warm = SETTINGS.palette !== 'grey', g = c => warm ? c : toGrey(c);
    this.C = { skyTop: g([6, 8, 16]), skyHz: g([30, 36, 52]), moon: g([236, 238, 246]), fog: g([28, 32, 46]), fire: g([255, 170, 90]) };
    this.T = TERRAIN.build({ N: 1024, lambda: 110, amp: 36, angle: -0.5, az: -0.9, el: 0.5, ambient: 0.1, gain: 1.1, second: 0.14, rough: 0.25, ripple: 0.04 });
    this.lut = TERRAIN.lut([[0, g([5, 6, 10])], [0.15, g([14, 15, 22])], [0.35, g([36, 38, 50])], [0.6, g([74, 76, 90])], [0.85, g([118, 118, 132])], [1, g([150, 150, 162])]]);
    this.RW = Math.round(W / 2); this.RH = Math.round(H / 2);
    this.cv = document.createElement('canvas'); this.cv.width = this.RW; this.cv.height = this.RH;
    this.cx2 = this.cv.getContext('2d'); this.img = this.cx2.createImageData(this.RW, this.RH);
    this.buf = new Uint32Array(this.img.data.buffer);
    this.cam = { x: 500, z: 300, h: 70, yaw: 0, fov: 1.05, horizon: 0.5 };
    this.camH = 70;
    // star field with a dense diagonal band (pre-rendered once)
    this.sky = document.createElement('canvas'); this.sky.width = base.width; this.sky.height = base.height;
    const s = this.sky.getContext('2d'); s.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (let i = 0; i < 2600; i++) {
      const u = Math.random(), off = (Math.random() + Math.random() + Math.random() - 1.5) * 0.12;
      const inBand = Math.random() < 0.7;
      const x = inBand ? u * W : Math.random() * W, y = inBand ? (0.9 - 0.85 * u + off) * H * 0.55 : Math.random() * H * 0.55;
      const b = Math.random() ** 3;
      s.globalAlpha = 0.15 + 0.8 * b; s.fillStyle = rgba(g([220, 226, 255]));
      const r = (0.4 + 1.3 * b) * scale; s.fillRect(x, y, r, r);
    }
    for (let i = 0; i < 40; i++) {
      const u = Math.random(), x = u * W, y = (0.9 - 0.85 * u + (Math.random() - 0.5) * 0.15) * H * 0.55, r = rand(30, 90) * scale;
      const gr = s.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rgba(g([120, 130, 170]), 0.05)); gr.addColorStop(1, rgba([0, 0, 0], 0));
      s.globalAlpha = 1; s.fillStyle = gr; s.fillRect(x - r, y - r, r * 2, r * 2);
    }
    this.bright = [];
    for (let i = 0; i < 14; i++) this.bright.push([Math.random(), Math.random() * 0.45, rand(0, TAU)]);
    this.meteor = null; this.next = rand(6, 14);
    this.camp = { x: 520, z: 520 };
  },
  update(dt, t) {
    const c = this.cam;
    c.z = 300 + t * 0.6 * SETTINGS.speed; c.x = 500 + Math.sin(t * 0.006) * 30;
    c.yaw = 0.25 * Math.sin(t * 0.004) + 0.1;
    let mx = 0; for (let k = 0; k < 5; k++) mx = Math.max(mx, TERRAIN.sample(this.T, c.x + Math.sin(c.yaw) * k * 12, c.z + k * 12));
    this.camH += ((mx + 32) - this.camH) * Math.min(1, dt * 0.5); c.h = this.camH;
    this.next -= dt;
    if (!this.meteor && this.next <= 0) { this.meteor = { x: rand(0.3, 0.9), y: rand(0.05, 0.25), vx: -rand(0.12, 0.2), vy: rand(0.05, 0.1), age: 0, life: 1.4 }; this.next = rand(14, 30); }
    if (this.meteor) { this.meteor.age += dt; if (this.meteor.age > this.meteor.life) this.meteor = null; }
    this.camp.z = c.z + 140;
  },
  project(wx, wz, hh) {
    const c = this.cam, RW = this.RW, RH = this.RH;
    const dx = wx - c.x, dz = wz - c.z, cy = Math.cos(c.yaw), sy = Math.sin(c.yaw);
    const lx = dx * cy - dz * sy, lz = dx * sy + dz * cy;
    if (lz < 1) return null;
    const focal = (RW / 2) / Math.tan(c.fov / 2);
    return [(RW / 2 + lx / lz * focal) * W / RW, (RH * c.horizon + (c.h - hh) / lz * focal) * H / RH, lz];
  },
  draw(t, ox, oy) {
    const C = this.C, hz = H * this.cam.horizon;
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    const sky = ctx.createLinearGradient(0, 0, 0, hz);
    sky.addColorStop(0, rgba(C.skyTop)); sky.addColorStop(1, rgba(C.skyHz));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(this.sky, ox * 0.1, oy * 0.1, W, H);
    for (const b of this.bright) {
      const tw = 0.7 + 0.3 * Math.sin(t * 0.8 + b[2]), x = b[0] * W, y = b[1] * H, r = 3.5 * tw * scale;
      ctx.globalAlpha = 0.7 * tw; ctx.strokeStyle = rgba(C.moon); ctx.lineWidth = 0.8 * scale;
      ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
    }
    if (this.meteor) {
      const m = this.meteor, k = m.age / m.life, x = (m.x + m.vx * m.age) * W, y = (m.y + m.vy * m.age) * H;
      const gr = ctx.createLinearGradient(x, y, x - m.vx * W * 0.4, y - m.vy * H * 0.4);
      gr.addColorStop(0, rgba(C.moon, 0.65 * Math.sin(Math.PI * k))); gr.addColorStop(1, rgba(C.moon, 0));
      ctx.globalAlpha = 1; ctx.strokeStyle = gr; ctx.lineWidth = 1.3 * scale;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - m.vx * W * 0.4, y - m.vy * H * 0.4); ctx.stroke();
    }
    // moon and halo
    const mx = this.focus[0] * W + ox * 0.1, my = this.focus[1] * H + oy * 0.1, mr = H * 0.035;
    let g = ctx.createRadialGradient(mx, my, 0, mx, my, H * 0.4);
    g.addColorStop(0, rgba(C.moon, 0.25)); g.addColorStop(0.1, rgba(C.moon, 0.08)); g.addColorStop(1, rgba(C.moon, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    g = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, 0, mx, my, mr);
    g.addColorStop(0, rgba(C.moon)); g.addColorStop(1, rgba(mixc(C.moon, [150, 150, 160], 0.4)));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.18; ctx.fillStyle = rgba([90, 92, 104]);
    for (const [dx, dy, r] of [[-0.3, -0.15, 0.22], [0.2, 0.25, 0.16], [0.15, -0.35, 0.1], [-0.15, 0.4, 0.09]]) { ctx.beginPath(); ctx.arc(mx + dx * mr, my + dy * mr, r * mr, 0, TAU); ctx.fill(); }
    // terrain
    ctx.globalAlpha = 1;
    TERRAIN.render(this.T, this.cam, this.buf, this.RW, this.RH, this.lut, C.fog, 1000, 0.0024);
    this.cx2.putImageData(this.img, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(this.cv, -12 * scale + ox * 0.3, -12 * scale + oy * 0.3, W + 24 * scale, H + 24 * scale);
    // a small camp in a hollow: tent silhouette and a gently flickering fire glow
    const cp = this.project(this.camp.x, this.camp.z, TERRAIN.sample(this.T, this.camp.x, this.camp.z));
    if (cp && cp[1] > hz) {
      const s = Math.max(0.5, 160 / cp[2]) * scale, fl = 0.85 + 0.1 * Math.sin(t * 2.3) + 0.05 * Math.sin(t * 5.1);
      ctx.globalCompositeOperation = 'lighter';
      g = ctx.createRadialGradient(cp[0] + 10 * s, cp[1] - 2 * s, 0, cp[0] + 10 * s, cp[1] - 2 * s, 60 * s);
      g.addColorStop(0, rgba(C.fire, 0.45 * fl)); g.addColorStop(0.2, rgba(C.fire, 0.15 * fl)); g.addColorStop(1, rgba(C.fire, 0));
      ctx.fillStyle = g; ctx.fillRect(cp[0] - 60 * s, cp[1] - 70 * s, 140 * s, 110 * s);
      ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = rgba([6, 6, 10]);
      ctx.beginPath(); ctx.moveTo(cp[0] - 9 * s, cp[1]); ctx.lineTo(cp[0] - 1 * s, cp[1] - 9 * s); ctx.lineTo(cp[0] + 7 * s, cp[1]); ctx.closePath(); ctx.fill();
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.9 * fl; ctx.fillStyle = rgba(C.fire);
      ctx.beginPath(); ctx.ellipse(cp[0] + 10 * s, cp[1] - 1.5 * s, 1.6 * s, 2.4 * s, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.25; ctx.strokeStyle = rgba([180, 180, 190]); ctx.lineWidth = 1 * s;
      for (let k = 0; k < 4; k++) { const ph = (t * 0.2 + k / 4) % 1; ctx.beginPath(); ctx.arc(cp[0] + 10 * s + Math.sin(t + k) * 3 * s, cp[1] - 5 * s - ph * 40 * s, (2 + ph * 8) * s, 0, TAU); ctx.globalAlpha = 0.15 * (1 - ph); ctx.stroke(); }
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    const v = ctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.35, W * 0.5, H * 0.5, W * 0.8);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  },
  hud() { return ['camp · 1 fire']; }
};

// ===================== TERRAIN ENGINE (realistic scenes) =====================
// A tileable dune heightfield with sun lighting and cast shadows, rendered every frame with a
// front-to-back column ("voxel space") renderer into a small image that is scaled up smoothly.
const TERRAIN = {
  build(o) {
    const N = o.N || 1024, M = N - 1, h = new Float32Array(N * N);
    const B = 128;
    const raw = (x, z) => {
      const a = o.angle ?? 0.35, ca = Math.cos(a), sa = Math.sin(a);
      const warp = noise3(x * 0.004, z * 0.004, 1.7) * 1.4 + noise3(x * 0.011, z * 0.011, 5.1) * 0.35;
      const u = (x * ca + z * sa) / o.lambda + warp;
      const f = u - Math.floor(u);
      const prof = f < 0.72 ? (1 - Math.cos(f / 0.72 * Math.PI)) / 2 : Math.pow(Math.cos((f - 0.72) / 0.28 * Math.PI / 2), 1.6);
      const ampMod = 0.55 + 0.45 * (0.5 + 0.5 * noise3(x * 0.003, z * 0.003, 9.2));
      // a second, smaller dune set at another angle makes crests branch and wander
      const u2 = (x * Math.cos(a + 1.1) + z * Math.sin(a + 1.1)) / (o.lambda * 0.45) + warp * 0.7;
      const f2 = u2 - Math.floor(u2), p2 = f2 < 0.7 ? (1 - Math.cos(f2 / 0.7 * Math.PI)) / 2 : Math.cos((f2 - 0.7) / 0.3 * Math.PI / 2);
      let v = o.amp * ampMod * prof + o.amp * (o.second ?? 0.22) * p2 + noise3(x * 0.006, z * 0.006, 3.3) * o.amp * (o.rough ?? 0.5);
      if (o.spires) {
        const s = noise3(x * 0.0065, z * 0.0065, 21.5) + 0.35 * noise3(x * 0.02, z * 0.02, 4.4);
        const m = clamp((s - o.spires.th) / 0.05, 0, 1);
        v = Math.max(v, m * (o.spires.height + noise3(x * 0.03, z * 0.03, 8) * 6) );
      }
      return v;
    };
    // seamless tiling: blend with the copy one period away inside an edge band
    for (let z = 0; z < N; z++) for (let x = 0; x < N; x++) {
      let v = raw(x, z);
      const sx = x > N - B ? (x - (N - B)) / B : 0, sz = z > N - B ? (z - (N - B)) / B : 0;
      if (sx || sz) {
        const vx = raw(x - N, z), vz = raw(x, z - N), vxz = raw(x - N, z - N);
        const ax = sx * sx * (3 - 2 * sx), az = sz * sz * (3 - 2 * sz);
        v = lerp(lerp(v, vx, ax), lerp(vz, vxz, ax), az);
      }
      h[z * N + x] = v;
    }
    // lighting: Lambert + soft cast shadows marched toward the light + ripple texture
    const L = [Math.cos(o.el) * Math.sin(o.az), Math.sin(o.el), Math.cos(o.el) * Math.cos(o.az)];
    const lh = Math.hypot(L[0], L[2]), dx = L[0] / lh, dz = L[2] / lh, rise = Math.tan(o.el);
    const light = new Float32Array(N * N);
    const a = o.angle ?? 0.35, ca = Math.cos(a), sa = Math.sin(a);
    for (let z = 0; z < N; z++) for (let x = 0; x < N; x++) {
      const i = z * N + x;
      const hx = h[z * N + ((x + 1) & M)] - h[z * N + ((x - 1) & M)], hz = h[((z + 1) & M) * N + x] - h[((z - 1) & M) * N + x];
      let nx = -hx / 2, ny = 1, nz = -hz / 2; const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
      let d = nx * L[0] + ny * L[1] + nz * L[2];
      d = Math.max(0, d);
      let sh = 1;
      if (d > 0) {
        let px = x, pz = z, ph = h[i];
        for (let s = 1; s < 70; s++) {
          px += dx * 1.5; pz += dz * 1.5; ph += rise * 1.5;
          const hh = h[((pz | 0) & M) * N + ((px | 0) & M)];
          if (hh > ph) { sh = Math.max(0.12, 1 - (hh - ph) * 0.35); if (sh <= 0.12) break; }
        }
      }
      const rip = 1 + (o.ripple ?? 0.03) * Math.sin((x * ca + z * sa) * 1.9 + noise3(x * 0.05, z * 0.05, 2) * 3) * (ny > 0.97 ? 1 : 0.3);
      light[i] = (o.ambient + (1 - o.ambient) * d * sh * o.gain) * rip;
    }
    return { N, M, h, light };
  },
  sample(T, x, z) {
    const { N, M, h } = T;
    const x0 = Math.floor(x), z0 = Math.floor(z), fx = x - x0, fz = z - z0;
    const i00 = (z0 & M) * N + (x0 & M), i10 = (z0 & M) * N + ((x0 + 1) & M), i01 = ((z0 + 1) & M) * N + (x0 & M), i11 = ((z0 + 1) & M) * N + ((x0 + 1) & M);
    return (h[i00] * (1 - fx) + h[i10] * fx) * (1 - fz) + (h[i01] * (1 - fx) + h[i11] * fx) * fz;
  },
  // renders into a Uint32 pixel buffer (RW × RH); sky stays transparent
  render(T, cam, buf32, RW, RH, colorLUT, fogC, zfar, fogK) {
    buf32.fill(0);
    const { N, M, h, light } = T;
    const tanH = Math.tan(cam.fov / 2), focal = (RW / 2) / tanH;
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    const hy = RH * cam.horizon;

      const sxn = (col - RW / 2) / (RW / 2) * tanH;

        const i00 = (z0 & M) * N + (x0 & M), i10 = (z0 & M) * N + ((x0 + 1) & M), i01 = ((z0 + 1) & M) * N + (x0 & M), i11 = ((z0 + 1) & M) * N + ((x0 + 1) & M);
        const hh = (h[i00] * (1 - fx) + h[i10] * fx) * (1 - fz) + (h[i01] * (1 - fx) + h[i11] * fx) * fz;
        let syv = (hy + (cam.h - hh) / z * focal) | 0;
        if (syv < ybuf) {
          const li = (light[i00] * (1 - fx) + light[i10] * fx) * (1 - fz) + (light[i01] * (1 - fx) + light[i11] * fx) * fz;
          const fog = 1 - Math.exp(-z * fogK);
          let ci = Math.min(LUTN - 1, Math.max(0, (li * (LUTN - 1) / 1.5) | 0));
          const c = colorLUT[ci];
          const r = c[0] + (fogC[0] - c[0]) * fog, g = c[1] + (fogC[1] - c[1]) * fog, b = c[2] + (fogC[2] - c[2]) * fog;
          const px = 0xff000000 | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0);

          for (let y = syv; y < ybuf; y++) buf32[y * RW + col] = px;
          ybuf = syv;
        }
        z += dz; dz *= 1.011;
      }
    }
  },
  lut(stops, n = 256) { const out = []; for (let i = 0; i < n; i++) out.push(ramp(stops, i / (n - 1) * 1.5 / 1.5)); return out; }
};

// ===================== ENGINE (shared) =====================
const THEMES = {
  grey:  { hue: 220, sat: 7 },
  warm:  { hue: 30, sat: 45 },
  green: { hue: 140, sat: 85 },
  ice:   { hue: 190, sat: 90 },
  amber: { hue: 36,  sat: 95 }
};
const theme = THEMES[SETTINGS.theme] || THEMES.grey;

const LEVELS = 24, PAL = [], RGB = [];
function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
for (let i = 0; i < LEVELS; i++) {
  const t = i / (LEVELS - 1);
  const s = Math.round(theme.sat * (1 - t * 0.78)), l = Math.round(18 + t * 72);
  PAL.push(`hsl(${theme.hue},${s}%,${l}%)`);
  RGB.push(hsl2rgb(theme.hue, s, l));
}
const shade = (t, a = 1) => {
  const i = Math.max(0, Math.min(LEVELS - 1, Math.round(t * (LEVELS - 1))));
  const c = RGB[i];
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
};

const base = document.getElementById('base'), over = document.getElementById('over');
const ctx = base.getContext('2d'), octx = over.getContext('2d');
let W, H, DPR, scale, bgSprite;
let mx = 0, my = 0, smx = 0, smy = 0;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const GLYPHS = Array.from('01∂∫∇∑∏πλθφψΩμνσ∞≈≡≠≤≥√Δ±×∈∀∃ℏ{}<>=+-*/^|()[]');
const pick = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];
// colour ramps for the realistic scenes: stops = [[t, [r,g,b]], ...]
const ramp = (stops, t) => {
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [t0, c0] = stops[i - 1], [t1, c1] = stops[i], f = (t - t0) / (t1 - t0 || 1);
    return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];
  }
  return stops[stops.length - 1][1];
};
const mixc = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const toGrey = c => { const l = 0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]; return [l * 0.97, l, l * 1.04]; };
const DARK = l => `hsl(${theme.hue},${Math.min(theme.sat, 10)}%,${l}%)`;   // near-black silhouette fill
// deterministic pseudo-random from an integer (stable shapes every frame)
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const MONO = s => `${(s * scale).toFixed(1)}px Consolas, "Cambria Math", "Segoe UI Symbol", "Courier New", monospace`;
const MATHF = s => `italic ${(s * scale).toFixed(1)}px "Cambria Math", "Times New Roman", serif`;

// Improved Perlin noise (3D)
const PERM = new Uint8Array(512);
(() => {
  const p = []; for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function noise3(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const fd = t => t * t * t * (t * (t * 6 - 15) + 10);
  const u = fd(x), v = fd(y), w = fd(z);
  const grad = (h, x, y, z) => {
    h &= 15; const a = h < 8 ? x : y, b = h < 4 ? y : (h === 12 || h === 14) ? x : z;
    return ((h & 1) ? -a : a) + ((h & 2) ? -b : b);
  };
  const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A + 1] + Z;
  const B = PERM[X + 1] + Y, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;
  return lerp(
    lerp(lerp(grad(PERM[AA], x, y, z), grad(PERM[BA], x - 1, y, z), u),
         lerp(grad(PERM[AB], x, y - 1, z), grad(PERM[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(PERM[AA + 1], x, y, z - 1), grad(PERM[BA + 1], x - 1, y, z - 1), u),
         lerp(grad(PERM[AB + 1], x, y - 1, z - 1), grad(PERM[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}

// Background: dark vertical gradient + soft glow at the scene's focus + vignette
function makeBg() {
  const c = document.createElement('canvas');
  c.width = base.width; c.height = base.height;
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const s = Math.min(theme.sat, 12), h = theme.hue;
  const lin = g.createLinearGradient(0, 0, 0, H);
  lin.addColorStop(0, `hsl(${h},${s}%,7%)`);
  lin.addColorStop(1, `hsl(${h},${s}%,2.5%)`);
  g.fillStyle = lin; g.fillRect(0, 0, W, H);
  const fx = SCENE.focus[0] * W, fy = SCENE.focus[1] * H;
  const rad = g.createRadialGradient(fx, fy, 0, fx, fy, Math.max(W, H) * 0.65);
  rad.addColorStop(0, `hsla(${h},${s}%,30%,${SCENE.glow ?? 0.28})`);
  rad.addColorStop(0.35, `hsla(${h},${s}%,16%,0.16)`);
  rad.addColorStop(1, `hsla(${h},${s}%,0%,0)`);
  g.fillStyle = rad; g.fillRect(0, 0, W, H);
  const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
  if (SCENE.ambient !== false) {
    // faint graph-paper dots, with a small cross every fourth point
    const sp = 46 * scale;
    g.fillStyle = PAL[14]; g.strokeStyle = PAL[14]; g.lineWidth = 0.8 * scale;
    for (let i = 0, x = sp / 2; x < W; x += sp, i++) {
      for (let j = 0, y = sp / 2; y < H; y += sp, j++) {
        if (i % 4 === 0 && j % 4 === 0) {
          g.globalAlpha = 0.13;
          g.beginPath(); g.moveTo(x - 3 * scale, y); g.lineTo(x + 3 * scale, y); g.moveTo(x, y - 3 * scale); g.lineTo(x, y + 3 * scale); g.stroke();
        } else { g.globalAlpha = 0.08; g.fillRect(x - 0.6 * scale, y - 0.6 * scale, 1.2 * scale, 1.2 * scale); }
      }
    }
    // rulers along the top and bottom edges
    g.globalAlpha = 0.16;
    g.beginPath();
    for (let k = 0, x = 0; x < W; x += 10 * scale, k++) {
      const L = (k % 10 === 0 ? 9 : k % 5 === 0 ? 5 : 2.5) * scale;
      g.moveTo(x, 0); g.lineTo(x, L); g.moveTo(x, H); g.lineTo(x, H - L);
    }
    g.stroke();
    // corner crop marks
    g.globalAlpha = 0.25;
    const m = 18 * scale, q = 14 * scale;
    g.beginPath();
    for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
      g.moveTo(x, y + sy * q); g.lineTo(x, y); g.lineTo(x + sx * q, y);
    }
    g.stroke();
    g.globalAlpha = 1;
  }
  return c;
}

// drifting faint characters, like dust in the light
const dust = [];
function drawDust(dt) {
  if (SCENE.dust === false) return;
  if (!dust.length) for (let i = 0; i < 30; i++) dust.push({ x: Math.random(), y: Math.random(), vx: rand(-0.004, 0.004), vy: rand(-0.006, -0.0015), g: pick(), a: rand(0.07, 0.18), s: rand(9, 12) });
  const o = octx;
  o.save(); o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = PAL[16];
  for (const d of dust) {
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); d.g = pick(); }
    if (d.x < -0.02) d.x = 1.02; if (d.x > 1.02) d.x = -0.02;
    o.globalAlpha = d.a; o.font = MONO(d.s);
    o.fillText(d.g, d.x * W, d.y * H);
  }
  o.restore();
}

// ---------- Overlay: equations typed out + top-right readout ----------
const EQ_ANCHORS = SCENE.anchors || [[0.30, 0.12], [0.58, 0.08], [0.26, 0.87], [0.60, 0.93], [0.34, 0.32], [0.74, 0.80]];
const eqSlots = [{ eq: -1, anchor: -1, age: 0, dur: 0 }, { eq: -1, anchor: -1, age: -5, dur: 0 }];
let eqNext = (Math.random() * SCENE.eqs.length) | 0;
function eqAssign(s) {
  s.eq = eqNext; eqNext = (eqNext + 1) % SCENE.eqs.length;
  const used = eqSlots.map(o => o.anchor);
  let a; do { a = (Math.random() * EQ_ANCHORS.length) | 0; } while (used.includes(a));
  s.anchor = a;
  s.dur = SCENE.eqs[s.eq].e.length / 20 + 8;
}
function drawOverlay(t, dt) {
  if (!SETTINGS.math) return;
  const o = octx;
  o.save();
  o.textBaseline = 'middle';
  for (const s of eqSlots) {
    if (s.eq < 0) eqAssign(s);
    s.age += dt;
    if (s.age < 0) continue;
    if (s.age > s.dur) { eqAssign(s); s.age = -2; continue; }
    const q = SCENE.eqs[s.eq], n = Math.min(q.e.length, Math.floor(s.age * 20));
    const fade = clamp((s.dur - s.age) / 1.5, 0, 1) * clamp(s.age * 2, 0, 1);
    const x = EQ_ANCHORS[s.anchor][0] * W, y = EQ_ANCHORS[s.anchor][1] * H;
    o.textAlign = 'left';
    o.font = MATHF(15.5);
    o.globalAlpha = 0.8 * fade; o.fillStyle = PAL[20];
    const shown = q.e.slice(0, n);
    o.fillText(shown, x, y);
    if (n < q.e.length) {
      const w = o.measureText(shown).width;
      o.fillRect(x + w + 3 * scale, y - 8 * scale, 1.4 * scale, 16 * scale);
    } else {
      o.font = MONO(10.5); o.fillStyle = PAL[13];
      o.globalAlpha = 0.6 * fade * clamp((s.age - q.e.length / 20) * 1.5, 0, 1);
      o.fillText('— ' + q.n, x, y + 20 * scale);
    }
  }
  o.font = MONO(10.5); o.textAlign = 'right'; o.textBaseline = 'top';
  const hx = W - 28 * scale; let hy = 26 * scale;
  const lines = [[SCENE.title, 0.62, 13], [SCENE.sub, 0.48, 13], ...(SCENE.hud ? SCENE.hud(t).map(l => [l, 0.48, 13]) : []),
                 [`t = ${t.toFixed(2).padStart(9, '0')} s`, 0.75, 20]];
  for (const [txt, al, c] of lines) { o.globalAlpha = al; o.fillStyle = PAL[c]; o.fillText(txt, hx, hy); hy += 16 * scale; }
  o.restore();
}

// ---------- Boot ----------
function setup() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [base, over]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scale = Math.max(0.6, Math.min(W, H) / 1080);
  bgSprite = makeBg();
  ctx.drawImage(bgSprite, 0, 0, W, H);
  SCENE.init();
}

let last = performance.now(), acc = 0, T0 = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  acc += now - last; last = now;
  if (acc < 1000 / SETTINGS.fps - 1) return;
  const dt = Math.min(acc / 1000, 0.1);
  acc = 0;
  const t = (now - T0) / 1000;
  smx += (mx - smx) * 0.05; smy += (my - smy) * 0.05;
  const off = SETTINGS.parallax ? 12 * scale : 0;
  const ox = smx * off, oy = smy * off;
  if (SCENE.update) SCENE.update(dt, t);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = SCENE.trail || 1;
  ctx.drawImage(bgSprite, 0, 0, W, H);
  ctx.globalAlpha = 1;
  SCENE.draw(t, ox, oy);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  octx.clearRect(0, 0, W, H);
  drawDust(dt);
  if (SCENE.drawOver) { octx.save(); SCENE.drawOver(t, ox, oy); octx.restore(); }
  drawOverlay(t, dt);
}
window.addEventListener('mousemove', e => { mx = (e.clientX / W) * 2 - 1; my = (e.clientY / H) * 2 - 1; });
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 200); });
setup();
requestAnimationFrame(loop);

</script>
</body>
</html>
